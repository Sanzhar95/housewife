<style>
:root{
  color-scheme:light;
  --bg:#f7f5fc; --surface:#ffffff; --surface-2:#f2eff9; --ink:#2a2338; --muted:#746c88; --line:#e8e3f2;
  --accent:#6a55d8; --accent-ink:#ffffff; --accent-soft:#ece8fc; --accent-deep:#4a38b0;
  --ok:#23825a; --ok-soft:#ddf4e8; --warn:#935d00; --warn-soft:#fff0c9; --bad:#cf3350; --bad-soft:#fde3e8;
  --pink-soft:#ffe7ee; --mint-soft:#e1f6ee;
  --radius:20px;
  --shadow:0 1px 2px rgba(60,40,120,.06),0 6px 20px rgba(60,40,120,.07);
  --font:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --hand:"Caveat", "Segoe Script", cursive;
  --nav-h:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#busy{position:fixed;top:0;left:0;right:0;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:left;opacity:0;transition:opacity .2s;z-index:80}
body.busy #busy{opacity:1;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:scaleX(.05)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:.2}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes toastout{from{opacity:1;transform:translateX(-50%)}to{opacity:0;transform:translate(-50%,6px)}}
#view.enter>*:nth-child(-n+5){animation:rise .18s ease-out backwards}
#view.enter>*:nth-child(2){animation-delay:30ms}
#view.enter>*:nth-child(3){animation-delay:60ms}
#view.enter>*:nth-child(4){animation-delay:90ms}
#view.enter>*:nth-child(5){animation-delay:120ms}
#view.enter>.fab{animation:none}
.item.just .chip.ok{animation:pop .24s ease-out}
.dchip,.icon-act,.icon-btn,.tab{transition:transform .12s,background .15s,color .15s}
.dchip:active,.icon-act:active,.icon-btn:active,.tab:active{transform:scale(.97)}
dialog[open]::backdrop{animation:fade .2s ease-out}
#toast.in{animation:toastin .2s ease-out}
#toast.out{animation:toastout .18s ease-in forwards}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after,::backdrop{transition:none!important;animation:none!important} body.busy #busy{transform:scaleX(1)} }

.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* Шапка и навигация */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-row{display:flex;align-items:center;gap:8px;padding:12px 0}
.brand{font-size:22px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:14px;background:var(--pink-soft);display:grid;place-items:center;font-size:22px;flex:none}
.hbtn{border:0;background:var(--surface-2);border-radius:99px;height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer}
.hbtn:hover,.hbtn.on{background:var(--accent-soft)}
nav{display:flex;gap:6px;padding-bottom:12px}
.tab{border:0;background:var(--surface-2);padding:9px 16px;border-radius:99px;color:var(--muted);cursor:pointer;font-weight:700;white-space:nowrap;display:flex;gap:8px;align-items:center;transition:transform .12s,background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.tab .ico{font-size:17px;line-height:1}

#banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid #f3dd9c}
#banner .wrap{display:flex;gap:10px;align-items:center;padding-top:4px;padding-bottom:4px;cursor:pointer}
#banner .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#banner .btn.sm{min-height:34px;padding:4px 14px;flex:none}

main{padding:22px 0 60px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:200px}
h2{font-size:26px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
h3{font-size:18px;font-weight:800;letter-spacing:-.005em}
.muted{color:var(--muted)}
.small{font-size:14px}
.check{display:flex;gap:9px;align-items:center;cursor:pointer;color:var(--muted);font-weight:700;min-height:40px}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* Кнопки и поля */
.btn{border:0;background:var(--surface-2);color:var(--ink);border-radius:99px;padding:10px 18px;cursor:pointer;font-weight:700;transition:transform .12s,background .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover:not(:disabled){background:var(--accent-soft)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(106,85,216,.28)}
.btn.primary:hover:not(:disabled){background:var(--accent-deep)}
.btn.ghost{background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.danger:hover:not(:disabled){background:var(--bad-soft)}
.btn.sm{padding:7px 14px;font-size:14px;min-height:38px}
.btn.wide{width:100%}
.auth{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.auth-note{text-align:center}
.auth .btn.primary{min-height:52px;font-size:17px}
.auth .hero{margin-bottom:0}
.set-links{display:flex;flex-direction:column;gap:8px}
.set-links .btn{min-height:48px;justify-content:center}
.link-box{display:flex;flex-direction:column;gap:10px}
.sync{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
body.anon nav, body.anon .hbtn{display:none}
.icon-act{border:0;background:transparent;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:17px;flex:none}
.icon-act:hover{background:var(--surface-2)}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],select{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;min-height:48px}
input:focus,select:focus{border-color:var(--accent);outline:none}
input[type=search]{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:10px 18px;min-width:230px;font-size:16px;min-height:44px}
input[type=search]:focus{border-color:var(--accent);outline:none}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--surface-2);color:var(--muted);width:fit-content}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:2px 18px 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.fchip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 15px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;min-height:40px}
.fchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.actions-row{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding:2px 0 4px}
.actions-row::-webkit-scrollbar{display:none}
.actions-row .btn{flex:none;white-space:nowrap;min-height:42px}

/* Сводка */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.stat b{font-size:22px;font-weight:800;line-height:1.1;display:block}
.stat span.l{font-size:13px;color:var(--muted);font-weight:600;line-height:1.25;display:block}
.si.a{background:var(--mint-soft)}.si.b{background:var(--warn-soft)}.si.c{background:var(--pink-soft)}

/* Герой «Сегодня» */
.hero{background:var(--accent-soft);border-radius:28px;padding:22px;display:flex;gap:22px;align-items:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--pink-soft);opacity:.8;z-index:0}
.hero>*{position:relative;z-index:1}
.hero-emoji{width:112px;height:112px;border-radius:34px;background:var(--surface);display:grid;place-items:center;font-size:62px;flex:none;box-shadow:var(--shadow);transform:rotate(-4deg)}
.hero-body{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.hand{font-family:var(--hand);font-size:28px;line-height:1;color:var(--accent-deep);font-weight:700}
.hero h2{font-size:30px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;gap:5px;align-items:center;background:var(--surface);border-radius:99px;padding:3px 11px 3px 8px;font-size:13.5px;font-weight:600}
.card .pill{background:var(--surface-2)}
.pill.lack,.card .pill.lack{background:var(--bad-soft);color:var(--bad)}
.pill small{color:var(--muted);font-weight:600}
.pill.lack small{color:var(--bad)}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* Неделя */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.day{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:14px;gap:10px;border:2px solid transparent}
.day.today{border-color:var(--accent)}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day-head b{font-weight:800}
.tag{background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px}
.day-emoji{width:56px;height:56px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;font-size:32px;flex:none}
.day-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.dish-name{font-size:18px;font-weight:800;line-height:1.2}
.dish-name.none{color:var(--muted);font-weight:600}
.day.done{background:var(--ok-soft)}
.day.done .day-emoji{background:var(--surface)}
.day.done .dish-name{color:var(--ok)}
.day-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;align-items:center}
.day-actions select{flex:1;min-width:0;min-height:40px;padding:6px 10px;border-radius:12px}

section.block{margin-top:30px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h3{flex:1}
.list{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 18px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .em{font-size:26px;flex:none}
.lrow .nm{flex:1;min-width:0;font-weight:700}
.lrow .nm small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.lrow .to{font-weight:800;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:4px 12px;white-space:nowrap}
.total-row{display:flex;justify-content:space-between;padding:12px 0 10px;font-weight:800}
.happy{background:var(--ok-soft);color:var(--ok);border-radius:var(--radius);padding:16px 18px;font-weight:700}

/* Дни и приёмы пищи */
.daystrip{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:4px 18px 6px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.dchip{flex:1 0 64px;border:2px solid transparent;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:64px}
.dchip .dn{font-size:13px;font-weight:800;color:var(--muted)}
.dchip .dd{font-size:20px;font-weight:800;line-height:1}
.dchip .dots{display:flex;gap:3px}
.dchip .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dchip .dots i.p{background:#b9aef0}.dchip .dots i.d{background:var(--ok)}
.dchip.today .dn{color:var(--accent-deep)}
.dchip.on{border-color:var(--accent);background:var(--accent-soft)}
.day-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.day-title .hand{font-size:32px}
.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.meal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.meal.done{background:var(--ok-soft)}
.meal-head{display:flex;align-items:center;gap:8px;min-height:38px}
.meal-head h3{flex:1}
.meal-ico{font-size:24px}
.item{border-radius:16px;background:var(--surface-2);padding:10px;display:flex;flex-direction:column;gap:8px}
.meal.done .item{background:var(--surface)}
.item.done{opacity:.95}
.item-main{display:flex;gap:10px;align-items:center}
.item-emo{width:46px;height:46px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:26px;flex:none}
.item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-name{font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.item.done .item-name{color:var(--ok)}
.kind{font-size:11px;font-weight:800;background:var(--pink-soft);color:#a3365a;border-radius:99px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.item-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.side{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:4px 4px 4px 10px}
.side-lbl{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.side select{border:0;min-height:38px;padding:4px 6px;flex:1;min-width:0;font-weight:700;background:transparent}
.side select:focus{outline:2px solid var(--accent)}
.add-side{border:0;background:none;color:var(--accent-deep);font-weight:700;cursor:pointer;padding:4px 2px;text-align:left;font-size:14px}
.meal-empty{color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:6px 0}
.meal-foot{display:flex;gap:6px;flex-wrap:wrap}
.meal-foot .btn{flex:1}
.stale{background:var(--warn-soft);color:var(--warn);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700;margin-bottom:16px}
.stale span{flex:1}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface-2);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;min-height:56px}
.pick-row:hover{background:var(--accent-soft)}
.pick-row.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.pick-row .em{font-size:26px}
.pick-row .nm{flex:1;min-width:0;font-weight:700}
.pick-sub{font-size:13px;font-weight:800;color:var(--muted);margin:8px 2px 0}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;cursor:pointer;color:var(--muted);min-height:42px}
.seg button.on{background:var(--surface);color:var(--accent-deep);box-shadow:var(--shadow)}
.togs{display:flex;gap:8px;flex-wrap:wrap}
.tog{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted);min-height:42px}
.tog.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.type-tag{font-size:12px;font-weight:800;color:var(--muted)}
/* Вчерашнее */
.chip.left{background:#dcf2f5;color:#1d6f7d}
.item.left{background:#e8f6f8}
.item-tools{display:flex;gap:0;margin-left:auto;flex:none}
.item-tools .icon-act{width:38px;height:38px;font-size:16px}
.btn.leftbtn{background:#dcf2f5;color:#1d6f7d}
.btn.leftbtn:hover:not(:disabled){background:#c9ebf0}
.item-actions .btn{flex:1}
.sugg{width:100%;border:2px dashed #9fd3db;background:#f2fbfc;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;font-weight:700;color:var(--ink)}
.sugg:hover{background:#e3f4f6}
.sugg .em{font-size:24px}
.sugg small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.dchip .dots i.l{background:#5fb8c6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700;margin:-8px 0 14px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* Склад */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile-top{display:flex;gap:12px;align-items:center;min-width:0}
.tile-top>div:last-child{min-width:0;display:flex;flex-direction:column;gap:4px}
.em-badge{width:50px;height:50px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;font-size:28px;flex:none}
.tile h3{font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.amount{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1}
.amount small{font-size:14px;color:var(--muted);font-weight:700;margin-left:4px}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.bar.low i{background:#e6a117}.bar.zero i{background:var(--bad)}
.tile-foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.tile-actions{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:2px}
.tile-actions .btn{flex:1}
.tile.lowt{box-shadow:inset 0 0 0 2px #f3d27a,var(--shadow)}
.tile.zerot{box-shadow:inset 0 0 0 2px #f2a3b0,var(--shadow)}
.empty{padding:34px;text-align:center;color:var(--muted);font-weight:600;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
.empty .big{font-size:44px;display:block;margin-bottom:6px}

/* Блюда */
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dish-top{display:flex;gap:12px;align-items:center}
.dish-top .em-badge{width:58px;height:58px;font-size:32px;border-radius:18px}
.dish-top .meta{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.cost{font-size:14px;font-weight:700;color:var(--muted)}
.card .actions{display:flex;gap:6px;align-items:center;margin-top:auto}
.card .actions .btn{flex:1}
ul.plain{margin:10px 0 0;padding-left:20px}

/* Цены */
.months{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;gap:10px;align-items:flex-end;height:200px;margin-bottom:18px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.mcol .mbar{width:100%;max-width:56px;border-radius:12px 12px 6px 6px;background:var(--accent-soft);min-height:4px}
.mcol.cur .mbar{background:var(--accent)}
.mcol .mv{font-size:12px;font-weight:800;white-space:nowrap}
.mcol .ml{font-size:13px;color:var(--muted);font-weight:700}
.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.price-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;border:0;text-align:left;width:100%}
.price-card:hover{box-shadow:inset 0 0 0 2px var(--accent-soft),var(--shadow)}
.price-card .mid{flex:1;min-width:0}
.price-card .pv{font-size:20px;font-weight:800;line-height:1.1}
.price-card .pv small{font-size:13px;color:var(--muted);font-weight:700}
.trend{font-size:13px;font-weight:800;border-radius:99px;padding:2px 9px}
.trend.up{background:var(--bad-soft);color:var(--bad)}
.trend.down{background:var(--ok-soft);color:var(--ok)}
.trend.flat{background:var(--surface-2);color:var(--muted)}
.spark{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bigchart{background:var(--surface-2);border-radius:16px;padding:10px}
.bigchart svg{display:block;width:100%;height:auto}
.hist td,.hist th{padding:9px 10px;font-size:14px}

/* Таблицы */
.tablewrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
thead th{background:var(--surface-2);font-weight:800;font-size:14px;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--line);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.filter-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-deep);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.filter-note span{flex:1}

/* Диалоги */
dialog{border:0;border-radius:26px;padding:0;background:var(--surface);color:var(--ink);width:min(470px,calc(100vw - 24px));box-shadow:0 24px 70px rgba(42,35,56,.35)}
dialog.wide{width:min(700px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(42,35,56,.45)}
@media (min-width:701px){dialog[open]{animation:rise .2s ease-out}}
#dlgBox{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg-head{padding:22px 24px 6px;display:flex;align-items:center;gap:10px}
.dlg-head h3{font-size:22px;flex:1}
.grab{display:none}
.dlg-body{padding:10px 24px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg-actions{display:flex;gap:8px;padding:14px 24px 20px;border-top:1px solid var(--line);align-items:center}
.dlg-actions .sp{flex:1}
.form{display:flex;flex-direction:column;gap:14px}
.form label,.form .fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.form label .hint,.form .fld .hint{font-weight:600;color:var(--muted)}
.form label.check{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.form label.check input{flex:none}
.calc{background:var(--surface-2);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ing-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 70px 40px;gap:8px;align-items:center;margin-bottom:8px}
.ing-row .unit-sel{padding:10px 4px;font-weight:700}
.qu{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.amount-alt{font-size:13px;color:var(--muted);font-weight:700;margin-top:-4px}
.ing-row select{padding:10px 6px}
.icon-btn{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;border-radius:50%;width:40px;height:40px}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
.imp-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.imp-row:last-child{border-bottom:0}
.imp-row .nm{flex:1;min-width:0;font-weight:700}
.imp-row .nm small{display:block;font-weight:600;color:var(--muted)}
.imp-row.err .nm small{color:var(--bad)}
.dropzone{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;font-weight:700;color:var(--muted);cursor:pointer;display:block}
.dropzone:hover{border-color:var(--accent);color:var(--accent-deep)}

/* Порции и «хватит на N раз» */
.stp{display:flex;align-items:center;gap:8px}
.stp-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer;flex:none;line-height:1}
.stp-btn:hover:not(:disabled){background:var(--accent-soft)}
.stp-btn:disabled{opacity:.4;cursor:not-allowed}
.stp input{width:88px;flex:none;text-align:center;font-weight:800;font-size:18px;padding:8px 6px}
.stp .stp-unit{color:var(--muted);font-weight:700}
.cook-sec{background:var(--surface-2);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.cook-sec .fld,.cook-sec label{font-size:14px}
.cook-sec .stp-btn{background:var(--surface)}
.cook-sec .stp-btn:hover:not(:disabled){background:var(--accent-soft)}
.warnline{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;white-space:pre-line}
.chip.times{background:var(--mint-soft);color:#17684a}
.chip.por{background:var(--accent-soft);color:var(--accent-deep)}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.news{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;background:var(--mint-soft);border-radius:20px;padding:8px 6px 10px 14px;margin-bottom:14px}
.news .em{font-size:26px;grid-area:1/1}
.news .tx{grid-area:1/2;font-weight:700;font-size:15px;line-height:1.3}
.news .tx small{display:block;color:var(--muted);font-weight:600;font-size:14px;line-height:1.3}
.news .btn{grid-area:2/2;justify-self:start;min-height:42px}
.news .icon-act{grid-area:1/3;align-self:start}

/* Помощь */
.help-hero{background:var(--accent-soft);border-radius:24px;padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.help-hero .hand{font-size:30px}
details.hs{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;scroll-margin-top:120px}
details.hs>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:60px;font-weight:800;font-size:17px;line-height:1.2}
details.hs>summary::-webkit-details-marker{display:none}
details.hs>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-size:20px;flex:none}
details.hs[open]>summary::after{content:"−"}
details.hs[open]>summary{color:var(--accent-deep)}
.hs-ico{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:21px;flex:none}
.hs-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.hs-body p,.hs-body li{line-height:1.5}
.hs-body ul,.hs-body ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.hs-body h4{margin:6px 0 -4px;font-size:15px;font-weight:800;color:var(--accent-deep)}
.tip{background:var(--warn-soft);color:#6b4500;border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.ex{background:var(--mint-soft);border-radius:14px;padding:10px 14px;font-size:15px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.keys b{font-size:20px;text-align:center;min-width:34px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100vw - 24px));background:var(--ink);color:#fff;padding:13px 20px;border-radius:18px;white-space:pre-line;z-index:90;box-shadow:0 10px 34px rgba(42,35,56,.35);font-weight:600}
#toast{pointer-events:none}
#toast.bad{background:var(--bad)}
#toast.good{background:var(--ok)}
.fab{display:none}
.mob{display:none}

/* ───── Телефон ───── */
@media (max-width:700px){
  :root{--nav-h:68px}
  .wrap{padding:0 14px}
  .scroller{margin:0 -14px 14px;padding:2px 14px 4px}
  .actions-row{margin:0 -14px 12px;padding:2px 14px 4px}
  .desk{display:none!important}
  .mob{display:initial}
  header.top{position:sticky}
  .top-row{padding:10px 0}
  .brand{font-size:19px;gap:8px}
  .logo{width:36px;height:36px;font-size:20px;border-radius:12px}
  .hbtn{width:42px;height:42px;padding:0;justify-content:center;font-size:18px}
  .hbtn .lbl{display:none}
  main{padding:16px 0 calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
  h2{font-size:23px}
  .toolbar{gap:4px 10px;margin-bottom:10px}
  .toolbar .grow{min-width:0;flex-basis:100%}
  .toolbar .check{min-height:42px}
  input[type=search]{min-width:0;width:100%;flex:1}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px}
  .stat .si{width:26px;height:26px;font-size:15px;border-radius:9px}
  .stat b{font-size:18px}
  .stat span.l{font-size:12px;line-height:1.25}
  .stat span.l{overflow-wrap:anywhere;hyphens:auto}
  .stat{min-width:0}
  .hero{flex-direction:column;align-items:stretch;padding:18px;border-radius:24px;gap:14px}
  .hero-emoji{width:76px;height:76px;font-size:42px;border-radius:24px}
  .hero h2{font-size:25px}
  .hero-actions .btn{flex:1}
  .meals{grid-template-columns:1fr;gap:10px}
  .daystrip{margin:0 -14px 14px;padding:4px 14px 6px}
  .dchip{flex:0 0 58px;min-width:58px}
  .day-title .hand{font-size:28px}
  .week{grid-template-columns:1fr;gap:10px}
  .day{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:12px;row-gap:10px;padding:12px}
  .day-head{grid-column:1/-1}
  .day-emoji{grid-column:1;grid-row:2}
  .day-main{grid-column:2;grid-row:2;justify-content:center}
  .day-actions{grid-column:1/-1}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:12px;gap:8px;border-radius:18px}
  .tile-top{flex-direction:column;align-items:flex-start;gap:8px}
  .em-badge{width:42px;height:42px;font-size:24px;border-radius:14px}
  .tile h3{font-size:15px}
  .amount{font-size:22px}
  .tile-foot{font-size:12px}
  .tile-actions .btn{padding:7px 8px}
  .dishes,.prices{grid-template-columns:1fr;gap:10px}
  .months{height:170px;padding:14px 10px;gap:6px}
  .mcol .mv{font-size:10px}
  .row2{grid-template-columns:1fr}
  .ing-row{grid-template-columns:minmax(0,1fr) 78px 62px 40px;gap:6px}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;box-shadow:0 -4px 20px rgba(60,40,120,.1);justify-content:space-around}
  .tab{flex-direction:column;gap:2px;padding:6px 4px;font-size:12px;background:none;border-radius:14px;flex:1;min-height:54px;justify-content:center}
  .tab.on{background:var(--accent-soft);color:var(--accent-deep)}
  .tab .ico{font-size:22px}

  .gen-btn{width:100%;min-height:50px;font-size:17px}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:35;height:58px;padding:0 22px;border-radius:99px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:16px;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(106,85,216,.45);cursor:pointer}
  .fab b{font-size:26px;line-height:1;font-weight:700}
  #toast{bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom,0px))}

  /* диалоги — как шторка снизу */
  dialog,dialog.wide{width:100%;max-width:100%;margin:auto 0 0;border-radius:26px 26px 0 0;max-height:92vh;animation:up .22s ease-out}  /* на телефоне выезжает снизу (перекрывает rise) */
  #dlgBox{max-height:92vh}
  .grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0}
  .dlg-head{padding:12px 18px 4px}
  .dlg-head h3{font-size:20px}
  .dlg-body{padding:8px 18px 16px}
  .dlg-actions{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
  .dlg-actions .btn.primary{flex:1;min-height:50px;white-space:nowrap}
  .dlg-actions .btn.ghost{min-height:50px}
}
.mods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--surface-2);border-radius:99px;padding:3px;margin-bottom:8px}
.mods button{border:0;background:transparent;border-radius:99px;min-height:44px;font-weight:800;color:var(--muted);cursor:pointer;font-size:16px}
.mods button[aria-selected="true"]{background:var(--surface);color:var(--accent-deep);box-shadow:var(--shadow)}
.cprog{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0 16px}
.cprog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.cdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:8px}
.cd{border:2px solid transparent;background:var(--surface);border-radius:16px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;color:var(--ink);cursor:pointer;min-height:72px;box-shadow:var(--shadow);min-width:0}
.cd b{font-size:13px}.cd .em{font-size:19px;line-height:1.3}.cd small{font-size:11px;color:var(--muted);font-weight:700}
.cd.sel{border-color:var(--accent);background:var(--accent-soft)}.cd.today b{color:var(--accent-deep)}.cd.rest{opacity:.6}
.ctools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 2px 12px;font-size:13px;color:var(--muted);font-weight:600}
.ctools .btn.sm{min-height:42px;flex:none}
.ctheme{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px}
.ctheme .ico{font-size:30px;line-height:1}.ctheme .t{flex:1;min-width:0;display:flex;flex-direction:column}.ctheme .t b{font-size:17px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.preset{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:54px;display:flex;flex-direction:column;gap:2px}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}.preset span{font-size:12.5px;color:var(--muted);font-weight:600}
.zone{margin:16px 2px 8px;font-weight:900;font-size:16px}
.pick{display:flex;align-items:center;gap:2px;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:4px 10px 4px 4px;margin-bottom:8px;min-height:58px;box-shadow:var(--shadow)}
.pick.on{border-color:var(--accent)}
.pick .box{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
.pick .box i{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff}
.pick.on .box i{background:var(--accent);border-color:var(--accent)}
.pick .pmain{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:44px}
.pick .ttl{flex:1;min-width:0;display:flex;flex-direction:column}.pick .ttl b{font-size:15px}.pick .ttl span{font-size:12.5px;color:var(--muted)}
.pick .chip{flex:none}
.cseg{display:flex;gap:6px;flex-wrap:wrap}
.cseg button{flex:none;min-height:44px;min-width:44px;padding:0 12px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
.cseg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.cseg button.off{opacity:.4;cursor:default}
.cseg.days button{padding:0 8px}
.cday-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.cday-head h3{font-size:19px}
.ctask{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px 12px;margin-bottom:10px}
.ctask.done{opacity:.65}
.ct-ico{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:24px}
.ct-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.ct-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ct-act{grid-column:1/-1;display:flex;gap:8px}
.ct-act .btn.primary{flex:1;min-height:50px;font-size:17px}
.ct-act .btn.ghost{min-height:50px}
.cquick{width:100%;min-height:54px;font-size:17px;margin:4px 0 16px;background:var(--warn-soft);color:var(--warn)}
.cbox{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.cbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cbox .row.sp{justify-content:space-between}
.cbox .fchip{white-space:normal;max-width:100%;text-align:left;line-height:1.25}
.chead{background:var(--accent-soft);border-radius:28px;padding:20px;margin-bottom:16px}
.chead h2{margin:4px 0 6px}
.lowbar{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius);padding:12px 14px;font-weight:700;margin-bottom:12px}
.sup-bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.sup-bar i{display:block;height:100%;background:var(--ok)}
.sup-bar.low i{background:var(--bad)}
.cbanner{background:var(--mint-soft);color:var(--ok);border-bottom:1px solid var(--line);cursor:pointer}
.cbanner .wrap{display:flex;align-items:center;gap:10px;min-height:44px;padding-top:4px;padding-bottom:4px}
.cbanner .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cbanner .btn.sm{min-height:34px}
.kbanner{background:var(--accent-soft);color:var(--accent-deep)}

<script>
const { UNITS, FACT, EPS, DEF_PORTIONS, MEALS } = Logic.consts;   // единицы, коэффициенты (г/мл/шт), общие с logic.js
const FAM = { 'КГ': 'm', 'Г': 'm', 'Л': 'v', 'МЛ': 'v', 'ШТ': 'p' };
const FAM_UNITS = { m: ['КГ', 'Г'], v: ['Л', 'МЛ'], p: ['ШТ'] };
const UNIT_LBL = { 'КГ': 'кг', 'Г': 'г', 'Л': 'л', 'МЛ': 'мл', 'ШТ': 'шт' };
const DAYS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const DAYS_FULL = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MONTHS_NOM = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

let S = null;
let isAdmin = false;       // видит «Новая семья для друга» (проверяется базой, не интерфейсом)
let tab = 'week';
let onlyAvail = true;
const q = { stock: '', dishes: '', prices: '', help: '' };
let dishFilter = 'all', stockFilter = 'all', priceFilter = 'all';
let selDay = null;
const genOpts = { meals: ['Завтрак', 'Обед', 'Ужин'], sides: true, leftovers: true };
const MEAL_EMO = { 'Завтрак': '🌅', 'Обед': '☀️', 'Ужин': '🌙' };
const TYPE_LBL = { main: 'Основное', side: 'Гарнир', extra: 'Салат / доп.' };

/* ───── эмодзи по названию ───── */
const PROD_EMO = [['творог', '🥣'], ['овсян', '🥣'], ['сливоч', '🧈'], ['картоф', '🥔'], ['морков', '🥕'], ['чеснок', '🧄'], ['лук', '🧅'], ['свекл', '🟣'], ['капуст', '🥬'],
  ['помидор', '🍅'], ['томат', '🍅'], ['огур', '🥒'], ['перец', '🫑'], ['яблок', '🍎'], ['банан', '🍌'], ['лимон', '🍋'],
  ['говяд', '🥩'], ['фарш', '🥩'], ['свинин', '🥓'], ['кур', '🍗'], ['рыб', '🐟'], ['рис', '🍚'], ['гречк', '🌾'], ['макарон', '🍝'],
  ['мук', '🌾'], ['сахар', '🍬'], ['молок', '🥛'], ['сметан', '🥣'], ['кефир', '🥛'], ['масл', '🫒'], ['яйц', '🥚'], ['сыр', '🧀'],
  ['хлеб', '🍞'], ['соль', '🧂'], ['чай', '🍵'], ['кофе', '☕'],
  ['картошк', '🥔'], ['мяс', '🥩'], ['сливк', '🥛'], ['майонез', '🥫'], ['тыкв', '🎃'], ['гриб', '🍄'], ['шампин', '🍄'], ['баклажан', '🍆'],
  ['горош', '🟢'], ['редьк', '🥬'], ['сельдер', '🥬'], ['тесто', '🥟'], ['спагетт', '🍝'], ['лапш', '🍜'], ['каш', '🥣'], ['фасол', '🫘'], ['чечевиц', '🫘'], ['яйц', '🥚']];
const DISH_EMO = [['пюре', '🥔'], ['рис', '🍚'], ['винегрет', '🥗'], ['омлет', '🍳'], ['борщ', '🍲'], ['плов', '🍛'], ['суп', '🍲'], ['блин', '🥞'], ['салат', '🥗'], ['котлет', '🍖'], ['макарон', '🍝'],
  ['яичниц', '🍳'], ['омлет', '🍳'], ['картош', '🥔'], ['пельмен', '🥟'], ['манты', '🥟'], ['пицц', '🍕'], ['пирог', '🥧'],
  ['рыб', '🐟'], ['гречк', '🍛'], ['курин', '🍗'], ['куриц', '🍗'], ['ножк', '🍗'], ['каша', '🥣'], ['сырник', '🧇'],
  ['мяс', '🥩'], ['бефстроган', '🥩'], ['бризол', '🥩'], ['болонь', '🍝'], ['спагетт', '🍝'], ['бешбармак', '🍲'], ['ачучук', '🥗'], ['лагман', '🍜'], ['гуляш', '🍲'], ['шашлык', '🍢'], ['бургер', '🍔']];
function emo(name, dish) {
  const n = String(name).toLowerCase().replace(/ё/g, 'е');
  const hit = (dish ? DISH_EMO : PROD_EMO).find(([k]) => n.includes(k));
  return hit ? hit[1] : (dish ? '🍽️' : '🧺');
}

/* ───── утилиты ───── */
const $ = (s, r = document) => r.querySelector(s);

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;            // только для SVG из чисел
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return e;
}

const r3 = Logic.calc.r3;
const fmt = n => r3(n).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
const qtyStr = (n, unit) => fmt(n) + '\u00a0' + (UNIT_LBL[unit] || unit);
const sameFam = Logic.util.sameFam;
const conv = Logic.util.conv;
const famOf = u => FAM_UNITS[FAM[u]] || UNITS;
/* 0,25 кг → 250 г; 1500 мл → 1,5 л */
function nice(x, u) {
  if (u === 'КГ' && x > 0 && x < 1) return [x * 1000, 'Г'];
  if (u === 'Г' && x >= 1000) return [x / 1000, 'КГ'];
  if (u === 'Л' && x > 0 && x < 1) return [x * 1000, 'МЛ'];
  if (u === 'МЛ' && x >= 1000) return [x / 1000, 'Л'];
  return [x, u];
}
const qtyNice = (n, unit) => { const [v, u] = nice(n, unit); return qtyStr(v, u); };
const numOut = x => String(Number(Number(x).toFixed(6)));
function unitSelect(units, selected, label) {
  return h('select', { class: 'unit-sel', 'aria-label': label || 'Единица' }, units.map(u => h('option', { value: u, selected: u === selected }, UNIT_LBL[u])));
}
const withUnit = (input, sel) => h('div', { class: 'qu' }, input, sel);
const money = n => Math.round(n).toLocaleString('ru-RU') + '\u00a0₸';
const byName = (a, b) => a.name.localeCompare(b.name, 'ru');
/* Только для экрана: первая буква заглавная. В данных, поиске, сортировке и формах — исходное название. */
const displayName = name => { const t = String(name == null ? '' : name); return t.charAt(0).toUpperCase() + t.slice(1); };
const P = id => S.products.find(p => p.id === id);
const D = id => S.dishes.find(d => d.id === id);
const ingOf = id => S.ing.filter(i => i.dish === id && P(i.product));
const isLow = Logic.calc.isLow;
const toNum = v => { const n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? null : n; };

function status(dishId) {
  const ings = ingOf(dishId);
  const lacks = ings.filter(i => P(i.product).stock + EPS < i.qty);
  return { ok: lacks.length === 0, lacks, empty: ings.length === 0 };
}

/* цены: храним за базовую единицу (кг, мл, шт), показываем за кг, литр, шт */
/* ps — цена за 1 г / 1 мл / 1 шт; показываем за кг, литр или штуку */
const STD = { m: 1000, v: 1000, p: 1 };
const perLbl = u => ({ m: 'кг', v: 'л', p: 'шт' })[FAM[u]] || 'шт';
const dispPrice = (ps, u) => ps * (STD[FAM[u]] || 1);
const priceStr = (ps, u) => money(dispPrice(ps, u)) + '/' + perLbl(u);
function pricesOf(pid) {
  return (S.purchases || []).filter(x => x.product === pid && x.price > 0)
    .map(x => Object.assign({}, x, { ps: x.price / (FACT[x.unit] || 1) }))
    .sort((a, b) => a.when.localeCompare(b.when));
}
function lastPrice(pid) { const a = pricesOf(pid); return a.length ? a[a.length - 1].ps : null; }
function dishCost(dishId) {
  let sum = 0, missing = 0;
  ingOf(dishId).forEach(i => { const lp = lastPrice(i.product); if (lp == null) missing++; else sum += lp * i.qty * (FACT[P(i.product).unit] || 1); });
  return { sum, missing };
}

function cleanErr(e) {
  const m = (e && e.message) ? e.message : String(e);
  return DB.cleanError({ message: m.replace(/^Error:\s*/, ''), status: e && e.status });
}

let toastTimer, toastOutTimer;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = kind || '';
  t.hidden = false;
  void t.offsetWidth; // перезапустить анимацию появления
  t.classList.add('in');
  clearTimeout(toastTimer);
  clearTimeout(toastOutTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove('in'); t.classList.add('out');
    toastOutTimer = setTimeout(() => { t.hidden = true; t.classList.remove('out'); }, 180);
  }, kind === 'bad' ? 7000 : 5000);
}

/* ───── Яндекс Метрика: цели и виртуальные просмотры. Ошибки Метрики никогда не мешают приложению. ───── */
const YM_ID = 114208985;
const YM_GOALS = { generateWeek: 'menu_generate', cookItem: 'cook', cookMeal: 'cook', cookDish: 'cook', setLeftover: 'leftover', addLeftover: 'leftover', adjustStock: 'stock_add', saveDish: 'dish_save', cleanDone: 'clean_done', saveAct: 'kids_activity_save', saveEvent: 'kids_event_save', setup: 'kids_setup' };
function ymGoal(goal) { try { if (typeof window.ym === 'function') window.ym(YM_ID, 'reachGoal', goal); } catch (e) { /* ничего */ } }
/** Цель по имени успешного действия. setLeftover(id, false) — «Буду готовить», не цель; cleanDone([..]) — быстрая уборка. */
function ymAction(fn, args) {
  if (fn === 'setLeftover' && !args[1]) return;
  if (fn === 'cleanDone' && Array.isArray(args[0])) return ymGoal('clean_quick');
  if (fn === 'pack') { if (args[2]) ymGoal('kids_packed'); return; }
  if (YM_GOALS[fn]) ymGoal(YM_GOALS[fn]);
}
let ymView = null;
/** Виртуальный просмотр при смене модуля/вкладки (первый экран уже засчитан самим счётчиком). */
function ymTrackView(key) {
  if (key === ymView) return;
  const first = ymView === null;
  ymView = key;
  if (first) return;
  try { if (typeof window.ym === 'function') window.ym(YM_ID, 'hit', location.pathname + '#' + key, { title: document.title, referer: location.href }); } catch (e) { /* ничего */ }
}

function call(fn, ...args) {
  if (!window.API || typeof API[fn] !== 'function') return Promise.reject(new Error('Нет такого действия: ' + fn));
  return API[fn](...args);
}

async function act(fn, ...args) {
  document.body.classList.add('busy');
  try {
    const st = await call(fn, ...args);
    S = st;
    ymAction(fn, args);
    if (st.notice) toast(st.notice);
    render();
    return st;
  } catch (e) {
    const m = cleanErr(e);
    if (m === 'Войдите заново') { sessionLost(); return null; }
    toast(m, 'bad');
    return null;
  } finally {
    document.body.classList.remove('busy');
  }
}

/* ───── диалоги (на телефоне — шторка снизу) ───── */
function modal({ title, body, okText = 'Сохранить', onOk, wide, extra, cancelText = 'Отмена', noOk }) {
  const dlg = $('#dlg');
  dlg.classList.toggle('wide', !!wide);
  $('#dlgBox').replaceChildren(
    h('div', { class: 'grab' }),
    h('div', { class: 'dlg-head' }, h('h3', { text: title }),
      h('button', { class: 'icon-btn', 'aria-label': 'Закрыть', onclick: () => dlg.close() }, '×')),
    h('div', { class: 'dlg-body' }, body),
    h('div', { class: 'dlg-actions' },
      extra ? h('button', { class: 'btn ghost ' + (extra.cls || ''), onclick: extra.onClick }, extra.text) : null,
      h('span', { class: 'sp' }),
      h('button', { class: 'btn ghost', onclick: () => dlg.close() }, cancelText),
      noOk ? null : h('button', { class: 'btn primary', onclick: async () => {
        const r = await onOk();
        if (r !== false) dlg.close();
      } }, okText))
  );
  if (!dlg.open) dlg.showModal();
}
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

function confirmBox(body, okText = 'Да', title = 'Подтвердите') {
  return new Promise(resolve => {
    let done = false;
    const fin = v => { if (!done) { done = true; resolve(v); } };
    modal({
      title,
      body: typeof body === 'string' ? h('p', { text: body }) : body,
      okText,
      onOk: () => { fin(true); }
    });
    $('#dlg').addEventListener('close', () => fin(false), { once: true });
  });
}

/* Подпись поля. В <label> оборачиваем только одиночное поле ввода: если внутри несколько кнопок,
   iPhone (Safari) при нажатии на любую из них «нажимает» ещё и первую — поэтому для групп берём <div>. */
const field = (label, input, hint) => {
  const single = input && ['INPUT', 'SELECT', 'TEXTAREA'].includes(input.tagName);
  return h(single ? 'label' : 'div', single ? {} : { class: 'fld' }, h('span', {}, label, hint ? h('span', { class: 'hint', text: ' ' + hint }) : null), input);
};
const numInput = (v, ph) => h('input', { type: 'number', step: 'any', min: '0', inputmode: 'decimal', value: v, placeholder: ph || '' });

/* ───── Excel ───── */
/* Единый формат Excel: один и тот же файл скачивается (список покупок или бланк склада),
   заполняется в магазине и загружается обратно. Жёлтые столбцы — заполнить, остальные — подсказки. */
const XL_HEAD = ['Название', 'Ед.', 'Купить (подсказка)', 'Куплено', 'Сумма, ₸', 'Мин. остаток', 'На складе', 'Нужно на меню', 'Примерно, ₸'];
const XL_OPTS = { fill: [4, 5, 6], unitCol: 2 };

async function offerXlsx(filename, rows, opts) {
  if (window.DEMO_SAVE) return window.DEMO_SAVE(filename, rows, opts);
  document.body.classList.add('busy');
  try {
    const url = await call('exportXlsx', filename.replace(/\.xlsx$/, ''), rows, opts || null);
    modal({
      title: '📄 Файл готов',
      body: h('div', { class: 'form' },
        h('p', { class: 'muted', text: 'Заполните в файле «Куплено» и, если хотите, «Сумма» — потом загрузите его обратно на вкладке «Склад».' }),
        h('a', { class: 'btn primary wide', href: url, download: filename }, '⬇️ Скачать ' + filename)),
      cancelText: 'Закрыть', noOk: true
    });
  } catch (e) {
    toast(cleanErr(e), 'bad');
  } finally {
    document.body.classList.remove('busy');
  }
}

function dateStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }   // по местному времени, не через UTC
function todayStr() { return dateStr(new Date()); }
function daysAgoStr(n, from) { const d = new Date(from == null ? Date.now() : from); d.setDate(d.getDate() - n); return dateStr(d); }

function xlRow(p, plan, need, cost) {
  return [p.name, p.unit, plan > 0 ? r3(plan) : '', '', '', r3(p.min), r3(p.stock), need > 0 ? r3(need) : '', cost != null ? Math.round(cost) : ''];
}

/** Бланк всего склада в том же формате — для большой закупки или первой загрузки. */
function downloadTemplate() {
  const need = weekNeed();
  const shop = {};
  shoppingList().forEach(r => { shop[r.p.id] = r; });
  const rows = [XL_HEAD];
  if (S.products.length) {
    [...S.products].sort(byName).forEach(p => {
      const r = shop[p.id];
      rows.push(xlRow(p, r ? r.buy : 0, need[p.id] || 0, r ? r.cost : null));
    });
  } else {
    rows.push(['Картофель', 'КГ', '', 3, 750, 1, '', '', '']);
    rows.push(['Молоко', 'Л', '', 2, 1100, 0.5, '', '', '']);
    rows.push(['Сыр', 'Г', '', 300, 1500, 100, '', '', '']);
    rows.push(['Яйца', 'ШТ', '', 10, 800, 4, '', '', '']);
  }
  offerXlsx(`Бланк склада ${todayStr()}.xlsx`, rows, XL_OPTS);
}

function normUnit(u) {
  const s = String(u || '').trim().toLowerCase().replace(/\.$/, '');
  if (!s) return '';
  if (['кг', 'kg', 'килограмм', 'килограммы', 'килограммов'].includes(s)) return 'КГ';
  if (['г', 'гр', 'g', 'грамм', 'граммы', 'граммов'].includes(s)) return 'Г';
  if (['л', 'l', 'литр', 'литры', 'литров'].includes(s)) return 'Л';
  if (['мл', 'ml', 'миллилитр', 'миллилитров'].includes(s)) return 'МЛ';
  if (['шт', 'pcs', 'штук', 'штуки', 'штука'].includes(s)) return 'ШТ';
  return '?';
}

function parseImport(aoa) {
  const rows = aoa.filter(r => r && r.some(c => String(c == null ? '' : c).trim() !== ''));
  if (!rows.length) return [];
  const head = rows[0].map(c => String(c == null ? '' : c).trim().toLowerCase());
  const col = (...keys) => { for (const k of keys) { const i = head.findIndex(c => c.startsWith(k)); if (i >= 0) return i; } return -1; };
  let idx = { name: col('назв', 'продукт'), unit: col('ед'), qty: col('куплен', 'кол'), min: col('мин'), total: col('сумм', 'цена') };
  let data = rows.slice(1);
  if (idx.name < 0) { idx = { name: 0, unit: 1, qty: 2, min: 3, total: 4 }; data = rows; }
  const get = (r, i) => i >= 0 && r[i] != null ? r[i] : '';
  return data.filter(r => !/^итого/i.test(String(get(r, idx.name)).trim())).map(r => {
    const name = String(get(r, idx.name)).trim();
    const fileUnit = normUnit(get(r, idx.unit));
    const qtyRaw = toNum(get(r, idx.qty));
    const minRaw = toNum(get(r, idx.min));
    const totalRaw = toNum(get(r, idx.total));
    const ex = S.products.find(p => p.name.toLowerCase() === name.toLowerCase());
    const unit = fileUnit || (ex ? ex.unit : '');
    let err = '';
    if (!name) err = 'нет названия';
    else if (fileUnit === '?') err = 'непонятная единица (нужно КГ, Г, Л, МЛ или ШТ)';
    else if (ex && !sameFam(unit, ex.unit)) err = `на складе в ${UNIT_LBL[ex.unit]}, а в файле ${UNIT_LBL[unit]}`;
    else if (!ex && !unit) err = 'укажите единицу для нового продукта';
    else if ((qtyRaw != null && qtyRaw < 0) || (totalRaw != null && totalRaw < 0) || (minRaw != null && minRaw < 0)) err = 'отрицательное число';
    // минимум меняем, только если его правда исправили (а не просто оставили подсказку)
    let min = '';
    if (minRaw != null) {
      if (!ex) min = r3(minRaw);
      else if (Math.abs(minRaw - ex.min) > 1e-9 && Math.abs(conv(minRaw, unit, ex.unit) - ex.min) > 1e-9) min = minRaw;
    }
    const qty = qtyRaw > 0 ? qtyRaw : 0;
    const kind = err ? 'err' : !ex ? 'new' : qty > 0 ? 'add' : min !== '' ? 'min' : 'skip';
    return { name, unit, qty, min, total: qty > 0 && totalRaw != null ? totalRaw : '', ex, err, kind };
  });
}

/* ───── Меню на неделю: дни × завтрак / обед / ужин ───── */
function parseDate(s) {
  const [y, m, d] = s.slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayDate() { const t = new Date(); t.setHours(0, 0, 0, 0); return addDays(t, -((t.getDay() + 6) % 7)); }
function todayIdx() {
  if (!S.settings.weekStart) return -1;
  const ws = parseDate(S.settings.weekStart);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - ws) / 86400000);
  return diff >= 0 && diff < 7 ? diff : -1;
}
const planOf = (day, meal) => (S.plan || []).filter(it => it.day === day && it.meal === meal)
  .sort((a, b) => (a.kind === 'main' ? 0 : 1) - (b.kind === 'main' ? 0 : 1));
const mainsFor = meal => S.dishes.filter(d => d.type === 'main' && d.meals.includes(meal));
const LEFT_MEALS = ['Обед', 'Ужин'];
const titleOf = (dish, side) => (D(dish) ? displayName(D(dish).name) : '') + (side && D(side) ? ' + ' + displayName(D(side).name) : '');
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
function dayLbl(day) {
  const ti = todayIdx();
  if (ti >= 0 && day - 1 === ti) return 'сегодня';
  if (ti >= 0 && day - 1 === ti + 1) return 'завтра';
  if (ti >= 0 && day - 1 === ti - 1) return 'вчера';
  const d = addDays(S.settings.weekStart ? parseDate(S.settings.weekStart) : mondayDate(), day - 1);
  return DAYS[d.getDay()].toLowerCase() + ' ' + d.getDate();
}
/* Что готовили недавно (вчера и сегодня раньше) — кандидаты «доесть». */
function recentCooked(day, meal) {
  const mi = MEALS.indexOf(meal);
  const seen = new Set(), out = [];
  (S.plan || []).filter(it => it.done && D(it.dish) && LEFT_MEALS.includes(it.meal) &&
      (it.day === day - 1 || (it.day === day && MEALS.indexOf(it.meal) < mi)))
    .sort((a, b) => (b.day - a.day) || (MEALS.indexOf(b.meal) - MEALS.indexOf(a.meal)) || ((a.kind === 'main' ? 0 : 1) - (b.kind === 'main' ? 0 : 1)))
    .forEach(it => {
      const side = it.kind === 'main' ? it.side : '';
      const key = it.dish + '+' + side;
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ dish: it.dish, side, from: `${dayLbl(it.day)}, ${it.meal.toLowerCase()}` });
    });
  return out;
}
/* Куда можно поставить остатки: следующие обеды и ужины сегодня и завтра. */
function leftoverTargets(day, meal) {
  const mi = meal ? MEALS.indexOf(meal) : -1;
  const out = [];
  [[day, m => MEALS.indexOf(m) > mi], [day + 1, () => true]].forEach(([d, ok]) => {
    if (d < 1 || d > 7) return;
    LEFT_MEALS.forEach(m => {
      if (!ok(m)) return;
      const main = planOf(d, m).find(i => i.kind === 'main');
      if (main && main.done) return;
      out.push({ day: d, meal: m, label: cap(`${dayLbl(d)}, ${m.toLowerCase()}`) + (main && D(main.dish) ? ` (вместо «${D(main.dish).name}»)` : '') });
    });
  });
  return out;
}
/* Число с кнопками − и ＋ (на телефоне удобнее, чем набирать). get() всегда возвращает целое в пределах min…max. */
function stepper(val, { min = 1, max = 99, label = '' } = {}, onChange) {
  const inp = h('input', { type: 'number', min: String(min), max: String(max), step: '1', inputmode: 'numeric', 'aria-label': label || 'Количество' });
  const clamp = x => Math.max(min, Math.min(max, Math.round(Number.isFinite(x) ? x : min)));
  let v = clamp(val);
  const dec = h('button', { type: 'button', class: 'stp-btn', 'aria-label': 'Меньше', onclick: () => set(v - 1) }, '−');
  const inc = h('button', { type: 'button', class: 'stp-btn', 'aria-label': 'Больше', onclick: () => set(v + 1) }, '＋');
  const sync = () => { dec.disabled = v <= min; inc.disabled = v >= max; };
  function set(x) { v = clamp(x); inp.value = v; sync(); if (onChange) onChange(v); }
  inp.addEventListener('input', () => { const n = toNum(inp.value); if (n != null) { v = clamp(n); sync(); if (onChange) onChange(v); } });
  inp.addEventListener('blur', () => { inp.value = v; });
  inp.value = v; sync();
  const el = h('div', { class: 'stp' }, dec, inp, inc);
  el.get = () => v;
  el.set = set;
  return el;
}

const guessMeal = () => { const hr = new Date().getHours(); return hr < 11 ? 'Завтрак' : hr < 16 ? 'Обед' : 'Ужин'; };

/* Куда встанут остатки при автоматической раскладке — те же правила, что на сервере. */
function autoSlots(src, count) {
  if (!src || count < 1) return [];
  const meal = src.meal === 'Ужин' ? 'Ужин' : 'Обед';
  const out = [];
  for (let i = 0; i < count && src.day + 1 + i <= 7; i++) out.push({ day: src.day + 1 + i, meal });
  return out;
}
function slotsLabel(slots) {
  const one = s => cap(dayLbl(s.day)) + ', ' + s.meal.toLowerCase();
  if (slots.length <= 3) return slots.map(one).join(' · ');
  return one(slots[0]) + ' … ' + one(slots[slots.length - 1]);
}

/**
 * Панель готовки: сколько порций, на сколько раз хватит и что с остатками.
 * o: { entries: () => [{dish, side, left}], mainId, src: {day, meal}|null, withLeft, onChange }
 */
function cookPanel(o) {
  const ents = () => o.entries();
  const cooks = () => ents().filter(e => !e.left);
  const first = cooks()[0];
  const portions = first ? stepper(defP() || dishP(o.mainId || first.dish), { min: 1, max: 100, label: 'Порций' }, () => { note(); o.onChange && o.onChange(); }) : null;
  const note = () => { if (portions) pNote.textContent = cooks().map(e => `«${D(e.dish).name}» — рецепт на ${dishP(e.dish)}`).filter((x, i, a) => a.indexOf(x) === i).join('; '); };
  const pNote = h('div', { class: 'muted small', style: 'font-weight:600' });
  const mainD = o.mainId ? D(o.mainId) : null;
  const times = o.withLeft && mainD ? stepper(mainD.times || 1, { min: 1, max: 7, label: 'Хватит на, раз' }, () => { drawSel(); }) : null;
  const targets = o.withLeft ? leftoverTargets(o.src ? o.src.day : 1, o.src ? o.src.meal : null) : [];
  const sel = h('select', { 'aria-label': 'Остатки на потом' });
  let touched = false;
  sel.addEventListener('change', () => { touched = true; });
  const hint = h('div', { class: 'muted small', style: 'font-weight:600' });
  function drawSel() {
    if (!times) return;
    const n = times.get();
    const auto = autoSlots(o.src, n - 1);
    const prev = sel.value;
    const opts = [];
    if (n > 1) opts.push(h('option', { value: 'auto' }, auto.length ? '♻️ Само, на следующие дни' : '♻️ Конец недели — не переносятся'));
    opts.push(h('option', { value: 'none' }, n > 1 ? 'Не ставить в меню' : 'Нет, съедим сразу'));
    targets.forEach((t, i) => opts.push(h('option', { value: String(i) }, (n > 1 ? 'Начать с: ' : '♻️ ') + t.label)));
    sel.replaceChildren(...opts);
    const valid = [...sel.options].some(op => op.value === prev);
    sel.value = touched && valid ? prev : (n > 1 ? 'auto' : 'none');
    hint.textContent = n > 1
      ? (auto.length ? `Встанет в меню: ${slotsLabel(auto)}. ` : '') + `Сегодня съедим, а ещё ${n - 1} ${timesWord(n - 1)} — «вчерашнее»: со склада второй раз не спишется.`
      : 'Если блюдо останется — выберите, на какой приём пищи его поставить.';
  }
  drawSel(); note();
  const timesEl = times ? field('Хватит на, раз', times, '— вместе с сегодняшним') : null;
  const leftEl = times ? h('div', { class: 'form' }, field('Остатки на потом', sel), hint) : null;
  return {
    pEl: portions ? h('div', { class: 'form' }, field('Готовим на, порций', portions), pNote) : null,
    lEl: times ? h('div', { class: 'cook-sec' }, timesEl, leftEl) : null,
    P: () => (portions ? portions.get() : 0),
    need() {
      const total = {};
      ents().forEach(e => {
        if (e.left) return;
        const n = needMap(e.dish, e.side || '', portions ? portions.get() : 0);
        Object.keys(n).forEach(k => { total[k] = (total[k] || 0) + n[k]; });
      });
      return total;
    },
    read() {
      const o2 = {};
      if (portions) o2.portions = portions.get();
      if (times) {
        o2.times = times.get();
        const v = sel.value;
        if (v === 'none') o2.target = 'none';
        else if (v !== 'auto') o2.target = { day: targets[+v].day, meal: targets[+v].meal };
        if (o.src) o2.src = o.src;
      }
      return o2;
    }
  };
}

/* Окно «Готовим?»: возвращает параметры для сервера или null, если передумали. */
async function askCook({ title, intro, entries, mainId, src, withLeft, watch, lead }) {
  const lack = h('div', { class: 'warnline', hidden: true });
  const list = h('ul', { class: 'plain' });
  const noteLine = h('p', { class: 'muted', hidden: true, text: 'Состав не указан — ничего не спишется.' });
  const listWrap = h('div', {}, h('p', { text: 'Спишу со склада:', style: 'font-weight:700' }), list);
  const panel = cookPanel({ entries, mainId, src, withLeft, onChange: () => redraw() });
  function redraw() {
    const cooking = entries().some(e => !e.left);
    const need = panel.need();
    const lines = needLines(need);
    list.replaceChildren(...lines.map(l => h('li', { text: l })));
    listWrap.hidden = !cooking || !lines.length;
    noteLine.hidden = !cooking || lines.length > 0;
    const l = lacksOf(need).map(k => `${P(k).name}: нужно ${qtyNice(need[k], P(k).unit)}, есть ${qtyNice(P(k).stock, P(k).unit)}`);
    lack.textContent = l.length ? 'Не хватает:\n' + l.join('\n') : '';
    lack.hidden = !l.length;
  }
  (watch || []).forEach(w => w.addEventListener('change', redraw));
  const body = h('div', { class: 'form' }, intro ? h('p', { text: intro }) : null, lead || null, panel.pEl, listWrap, noteLine, lack, panel.lEl);
  redraw();
  const noCook = !entries().some(e => !e.left);
  if (!(await confirmBox(body, noCook ? 'Готово' : 'Приготовлено', title))) return null;
  return panel.read();
}

function chip(st) {
  if (st.empty) return h('span', { class: 'chip', text: 'Состав не указан' });
  if (st.ok) return h('span', { class: 'chip ok', text: '✓ Всё есть' });
  const names = st.lacks.map(i => P(i.product).name);
  const shown = names.slice(0, 2).join(', ') + (names.length > 2 ? ` и ещё ${names.length - 2}` : '');
  return h('span', { class: 'chip bad', text: 'Не хватает: ' + shown });
}
function needChip(need) {
  const l = lacksOf(need).map(k => P(k).name);
  if (!Object.keys(need).length) return h('span', { class: 'chip', text: 'Состав не указан' });
  if (!l.length) return h('span', { class: 'chip ok', text: '✓ Всё есть' });
  return h('span', { class: 'chip bad', text: 'Не хватает: ' + l.slice(0, 2).join(', ') + (l.length > 2 ? ` и ещё ${l.length - 2}` : '') });
}
function ingPills(dishId, max) {
  const ings = ingOf(dishId);
  const shown = max ? ings.slice(0, max) : ings;
  return h('div', { class: 'pills' }, shown.map(i => {
    const p = P(i.product);
    const lack = p.stock + EPS < i.qty;
    return h('span', { class: 'pill' + (lack ? ' lack' : '') }, emo(p.name), displayName(p.name), h('small', { text: qtyStr(conv(i.qty, p.unit, i.unit), i.unit) }));
  }), ings.length > shown.length ? h('span', { class: 'pill', text: `и ещё ${ings.length - shown.length}` }) : null);
}

function mealCard(day, meal) {
  const items = planOf(day, meal);
  const main = items.find(i => i.kind === 'main');
  const extras = items.filter(i => i.kind === 'extra');
  const pending = items.filter(i => !i.done && i.dish);
  const allDone = items.length > 0 && !pending.length;
  const need = {};
  pending.forEach(it => { const n = itemNeed(it); Object.keys(n).forEach(k => { need[k] = (need[k] || 0) + n[k]; }); });
  return h('div', { class: 'meal' + (allDone ? ' done' : '') },
    h('div', { class: 'meal-head' },

}

    h('div', { class: 'stat' }, h('div', { class: 'si b', text: '🛒' }), h('div', {}, h('b', { text: S.products.filter(isLow).length }), h('span', { class: 'l', text: 'продуктов на исходе' }))),
    h('div', { class: 'stat' }, h('div', { class: 'si c', text: '✅' }), h('div', {}, h('b', { text: `${plan.filter(i => i.done).length} из ${plan.filter(i => i.dish).length}` }), h('span', { class: 'l', text: 'блюд приготовлено' })))));

    const date = addDays(ws, day - 1);

      h('span', { class: 'dd', text: date.getDate() }),

      })));
  })));

    h('span', {}, h('i', { style: 'background:#b9aef0' }), 'запланировано'),
    h('span', {}, h('i', { style: 'background:#5fb8c6' }), 'вчерашнее')));

}

/* ───── Склад ───── */
function productForm(p) {
  const name = h('input', { type: 'text', value: p ? p.name : '', placeholder: 'Например, Мука', enterkeyhint: 'next' });
  const unit = unitSelect(UNITS, p ? p.unit : 'КГ');
  const stock = numInput(p ? numOut(p.stock) : '', '0');
  const min = numInput(p ? numOut(p.min) : '', '0');
  let prevU = unit.value;
  unit.addEventListener('change', () => {
    const nu = unit.value;
    if (sameFam(prevU, nu)) {
      [stock, min].forEach(inp => { const v = toNum(inp.value); if (v != null) inp.value = numOut(conv(v, prevU, nu)); });
    } else if (p && S.ing.some(i => i.product === p.id)) {
      toast('Это единица другого типа: количества в рецептах не пересчитаются, проверьте их после сохранения.', 'bad');
    }
    prevU = nu;
  });
  const total = h('input', { type: 'number', step: 'any', min: '0', inputmode: 'decimal', placeholder: 'необязательно' });
  modal({
    title: p ? '✏️ Изменить продукт' : '🧺 Новый продукт',
    body: h('div', { class: 'form' },
      field('Название', name),
      h('div', { class: 'row2' }, field('Единица', unit), field('Сейчас на складе', stock)),
      field('Когда пора докупать', min, '— минимальный остаток'),
      p ? null : field('Сколько заплатили, ₸', total, '— для аналитики цен')),
    extra: p ? { text: '🗑️ Удалить', cls: 'danger', onClick: () => delProduct(p) } : null,
    onOk: async () => !!(await act('saveProduct', { id: p ? p.id : '', name: name.value, unit: unit.value, stock: stock.value, min: min.value, total: p ? '' : total.value }))
  });
}

function restockForm(p) {
  const amount = numInput('', '0');
  amount.setAttribute('aria-label', 'Сколько купили');
  const unit = unitSelect(famOf(p.unit), p.unit);
  const total = h('input', { type: 'number', step: 'any', min: '0', inputmode: 'decimal', placeholder: 'необязательно' });
  const lp = lastPrice(p.id);
  const hint = lp != null ? `В прошлый раз: ${priceStr(lp, p.unit)}` : 'Укажите сумму — посчитаю цену за ' + perLbl(p.unit);
  const calc = h('div', { class: 'calc', text: hint });
  const upd = () => {
    const a = toNum(amount.value), t = toNum(total.value);
    if (!(a > 0)) { calc.textContent = hint; return; }
    const inP = conv(a, unit.value, p.unit);
    let txt = `Станет на складе: ${qtyNice(p.stock + inP, p.unit)}`;
    if (t > 0) {
      const ps = t / (a * (FACT[unit.value] || 1));
      txt += `\nЦена: ${priceStr(ps, p.unit)}`;
      if (lp != null) {
        const d = (ps - lp) / lp * 100;
        txt += Math.abs(d) < 0.5 ? ', как в прошлый раз' : d > 0 ? `, дороже на ${Math.round(d)}%` : `, дешевле на ${Math.round(-d)}%`;
      }
    }
    calc.textContent = txt;
  };
  [amount, total].forEach(x => x.addEventListener('input', upd));
  unit.addEventListener('change', upd);
  calc.style.whiteSpace = 'pre-line';
  modal({
    title: `${emo(p.name)} Приход: ${displayName(p.name)}`,
    body: h('div', { class: 'form' },
      h('p', { class: 'muted', text: 'Сейчас на складе: ' + qtyNice(p.stock, p.unit) }),
      field('Сколько купили', withUnit(amount, unit)),
      field('Заплатили, ₸', total),
      calc),
    okText: 'Добавить на склад',
    onOk: async () => {
      if (!(toNum(amount.value) > 0)) { toast('Введите количество больше нуля.', 'bad'); return false; }
      return !!(await act('adjustStock', p.id, amount.value, total.value, unit.value));
    }
  });
}

async function delProduct(p) {
  const used = S.ing.filter(i => i.product === p.id).length;
  const msg = `Удалить продукт «${p.name}»?` + (used ? ` Он пропадёт из состава блюд (${used}).` : '');
  if (await confirmBox(msg, 'Удалить', '🗑️ Удаляем?')) act('deleteProduct', p.id);
}

function tile(p) {
  const cls = p.stock <= 0 ? 'zero' : isLow(p) ? 'low' : '';
  const cap = p.min > 0 ? p.min * 3 : Math.max(p.stock, 1);
  const pct = p.stock <= 0 ? 4 : Math.max(8, Math.min(100, p.stock / cap * 100));
  const lp = lastPrice(p.id);
  return h('div', { class: 'tile ' + (cls ? cls + 't' : '') },
    h('div', { class: 'tile-top' },
      h('div', { class: 'em-badge', text: emo(p.name) }),
      h('div', {}, h('h3', { text: displayName(p.name) }),
        p.stock <= 0 ? h('span', { class: 'chip bad', text: 'Закончился' })
          : isLow(p) ? h('span', { class: 'chip warn', text: 'Пора докупить' })
          : h('span', { class: 'chip ok', text: 'В наличии' }))),
    h('div', { class: 'amount' }, fmt(p.stock), h('small', { text: UNIT_LBL[p.unit] })),
    nice(p.stock, p.unit)[1] !== p.unit ? h('div', { class: 'amount-alt', text: '= ' + qtyNice(p.stock, p.unit) }) : null,
    h('div', { class: 'bar ' + cls }, h('i', { style: `width:${pct}%` })),
    p.min > 0 || lp != null ? h('div', { class: 'tile-foot' }, p.min > 0 ? h('span', { text: 'мин. ' + qtyNice(p.min, p.unit) }) : null, lp != null ? h('span', { text: priceStr(lp, p.unit) }) : null) : null,
    h('div', { class: 'tile-actions' },
      h('button', { class: 'btn sm', onclick: () => restockForm(p) }, '＋ Приход'),
      h('button', { class: 'icon-act', title: 'Изменить', 'aria-label': 'Изменить ' + displayName(p.name), onclick: () => productForm(p) }, '✏️')));
}

function drawStock(host) {
  host.replaceChildren();
  const qs = q.stock.trim().toLowerCase();
  const list = S.products.filter(p => (!qs || p.name.toLowerCase().includes(qs)) &&
    (stockFilter === 'all' || (stockFilter === 'low' ? isLow(p) : p.stock <= 0)))
    .sort((a, b) => (isLow(b) - isLow(a)) || byName(a, b));
  if (!list.length) {
    host.className = '';
    host.append(h('div', { class: 'empty' }, h('span', { class: 'big', text: S.products.length ? '🔍' : '🧺' }),
      S.products.length ? 'Ничего не найдено.' : 'На складе пока пусто. Добавьте продукт или загрузите список из Excel.'));
    return;
  }
  host.className = 'tiles';
  list.forEach(p => host.append(tile(p)));
}

function renderStock(v) {
  const host = h('div');
  const low = S.products.filter(isLow).length, zero = S.products.filter(p => p.stock <= 0).length;
  const chips = h('div', { class: 'scroller' });
  const drawChips = () => {

      .map(([k, t]) => h('button', { class: 'fchip' + (stockFilter === k ? ' on' : ''), onclick: () => { stockFilter = k; drawChips(); drawStock(host); } }, t)));
  };

  v.append(h('div', { class: 'toolbar' },

    h('input', { type: 'search', placeholder: '🔍 Найти продукт', value: q.stock, 'aria-label': 'Поиск продукта', oninput: e => { q.stock = e.target.value; drawStock(host); } }),

    h('button', { class: 'btn sm', 'aria-label': 'Список покупок в Excel', onclick: exportShopping }, '🛒 Покупки'),
    h('button', { class: 'btn sm', 'aria-label': 'Бланк склада', onclick: downloadTemplate }, '📄 Бланк')));
  v.append(chips, host);
  drawStock(host);
  v.append(h('button', { class: 'fab', onclick: () => productForm(null) }, h('b', { text: '＋' }), 'Продукт'));
}

/* ───── Блюда ───── */
function ingRow(item) {
  const nameIn = h('input', { type: 'text', list: 'plist', placeholder: 'Продукт', value: item.name || '', 'aria-label': 'Продукт' });
  const qty = numInput(item.qty != null ? numOut(item.qty) : '', 'Сколько');
  qty.setAttribute('aria-label', 'Количество');
  const unitSel = h('select', { class: 'unit-sel', 'aria-label': 'Единица' });
  let famKey = null;
  const find = () => S.products.find(p => p.name.toLowerCase() === nameIn.value.trim().toLowerCase());
  const sync = () => {
    const p = find();
    const units = p ? famOf(p.unit) : UNITS;
    const key = units.join();
    if (key === famKey) return;
    const cur = unitSel.value || item.unit || (p ? p.unit : 'КГ');
    unitSel.replaceChildren(...units.map(u => h('option', { value: u }, UNIT_LBL[u])));
    unitSel.value = units.includes(cur) ? cur : (p ? p.unit : units[0]);
    famKey = key;
  };
  nameIn.addEventListener('input', sync);
  const row = h('div', { class: 'ing-row' }, nameIn, qty, unitSel,
    h('button', { class: 'icon-btn', type: 'button', title: 'Убрать', 'aria-label': 'Убрать из состава', onclick: () => row.remove() }, '×'));
  sync();
  row.read = () => {
    const p = find();
    return p ? { product: p.id, qty: qty.value, unit: unitSel.value } : { product: '', newName: nameIn.value.trim(), unit: unitSel.value, qty: qty.value };
  };
  return row;
}

function dishForm(d) {
  const name = h('input', { type: 'text', value: d ? d.name : '', placeholder: 'Например, Борщ' });
  const note = h('input', { type: 'text', value: d ? d.note : '', placeholder: 'Необязательно' });
  let type = d ? d.type : (dishFilter === 'side' || dishFilter === 'extra' ? dishFilter : 'main');
  const meals = new Set(d ? d.meals : ['Обед', 'Ужин']);
  const withSide = h('input', { type: 'checkbox', checked: d ? d.withSide : false });
  const portionsIn = h('input', { type: 'number', step: 'any', min: '1', max: '100', inputmode: 'decimal', placeholder: String(DEF_PORTIONS), value: d && d.portions > 0 ? d.portions : '' });
  const timesStep = stepper(d ? d.times || 1 : 1, { min: 1, max: 7, label: 'Хватает на, раз' });
  const seg = h('div', { class: 'seg' });
  const togs = h('div', { class: 'togs' });
  const mainOpts = h('div', { class: 'form' },
    field('Когда подавать', togs),
    h('label', { class: 'check' }, withSide, 'Подаётся с гарниром (пюре, рис, гречка…)'),
    field('Хватает на, раз', timesStep, '— суп, плов: после готовки остатки сами встанут на следующие дни как «вчерашнее»'));
  const drawSeg = () => {
    seg.replaceChildren(...['main', 'side', 'extra'].map(t => h('button', { type: 'button', class: type === t ? 'on' : '', onclick: () => { type = t; drawSeg(); } }, TYPE_LBL[t])));
    mainOpts.hidden = type !== 'main';
  };
  const drawT = () => togs.replaceChildren(...MEALS.map(m => h('button', { type: 'button', class: 'tog' + (meals.has(m) ? ' on' : ''),
    onclick: () => { meals.has(m) ? meals.delete(m) : meals.add(m); drawT(); } }, MEAL_EMO[m] + ' ' + m)));
  drawSeg(); drawT();
  const rows = h('div');
  const dl = h('datalist', { id: 'plist' }, [...S.products].sort(byName).map(p => h('option', { value: p.name }, UNIT_LBL[p.unit])));
  const existing = d ? ingOf(d.id).map(i => ({ name: P(i.product).name, qty: conv(i.qty, P(i.product).unit, i.unit), unit: i.unit })) : [];
  (existing.length ? existing : [{}]).forEach(i => rows.append(ingRow(i)));
  modal({
    title: d ? '✏️ Изменить блюдо' : '🍲 Новое блюдо',
    wide: true,
    body: h('div', { class: 'form' },
      dl,
      field('Название', name),
      field('Тип блюда', seg),
      field('Рецепт рассчитан на, порций', portionsIn, `— пусто: считаем ${DEF_PORTIONS}`),
      mainOpts,
      field('Заметка', note),
      h('div', {},
        h('div', { class: 'muted small', style: 'margin-bottom:10px;font-weight:600', text: 'Что нужно на одну готовку (на указанное число порций; при готовке можно выбрать другое — всё пересчитается). Выберите продукт из списка или впишите новый — он появится на складе. Единицы пересчитываются сами: можно писать 250 г, даже если продукт считается в кг.' }),
        rows,
        h('button', { class: 'btn sm', type: 'button', onclick: () => { const r = ingRow({}); rows.append(r); r.querySelector('input').focus(); } }, '＋ Ещё продукт'))),
    extra: d ? { text: '🗑️ Удалить', cls: 'danger', onClick: () => delDish(d) } : null,
    onOk: async () => {
      if (type === 'main' && !meals.size) { toast('Выберите, когда подавать блюдо.', 'bad'); return false; }
      const ingredients = [...rows.children].map(r => r.read()).filter(i => (i.product || i.newName) && toNum(i.qty) > 0);
      const pv = String(portionsIn.value).trim();
      if (pv !== '' && !(toNum(pv) >= 1 && toNum(pv) <= 100)) { toast('Порций в рецепте — от 1 до 100 (или оставьте пустым).', 'bad'); return false; }
      return !!(await act('saveDish', { id: d ? d.id : '', name: name.value, note: note.value, type, meals: [...meals], withSide: withSide.checked,
        portions: pv, times: type === 'main' ? timesStep.get() : 1, ingredients }));
    }
  });
}

async function delDish(d) {
  if (await confirmBox(`Удалить блюдо «${d.name}»? Оно пропадёт и из меню недели.`, 'Удалить', '🗑️ Удаляем?')) act('deleteDish', d.id);
}

/* Приготовить вне меню; к основному блюду можно выбрать гарнир */
async function cookFlow(dish) {
  const sides = S.dishes.filter(x => x.type === 'side').sort(byName);
  const sel = dish.type === 'main' && sides.length ? h('select', {}, h('option', { value: '' }, 'без гарнира'),
    sides.map(x => h('option', { value: x.id }, emo(x.name, true) + ' ' + displayName(x.name)))) : null;
  const ti = todayIdx();
  const withLeft = dish.type !== 'side' && ti >= 0;
  const opts = await askCook({
    title: `${emo(dish.name, true)} ${dish.name}: готовим?`,
    intro: sel ? null : `«${dish.name}»`,
    entries: () => [{ dish: dish.id, side: sel ? sel.value : '', left: false }],
    mainId: dish.id, src: withLeft ? { day: ti + 1, meal: guessMeal() } : null, withLeft,
    watch: sel ? [sel] : [], lead: sel ? field('Гарнир', sel) : null
  });
  if (!opts) return;
  const st = await act('cookDish', dish.id, sel ? sel.value : '', opts);
  if (st && !st.notice) toast('Приятного аппетита! Продукты списаны со склада.', 'good');
}
