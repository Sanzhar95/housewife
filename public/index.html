/* ───── Цены и расходы ───── */
function sparkSvg(vals, w, hh, big) {
  const mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1, pad = big ? 14 : 3;
  const pts = vals.map((v, i) => [pad + i * (w - 2 * pad) / Math.max(1, vals.length - 1), hh - pad - (v - mn) / span * (hh - 2 * pad)]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const up = vals[vals.length - 1] > vals[0];
  const col = vals.length < 2 || vals[vals.length - 1] === vals[0] ? '#746c88' : up ? '#cf3350' : '#23825a';
  const area = `${pts[0][0].toFixed(1)},${hh} ${line} ${pts[pts.length - 1][0].toFixed(1)},${hh}`;
  const dots = big ? pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#fff" stroke="${col}" stroke-width="2.5"/>`).join('') : '';
  return `<svg viewBox="0 0 ${w} ${hh}" ${big ? '' : `width="${w}" height="${hh}"`} aria-hidden="true"><polygon points="${area}" fill="${col}" opacity=".1"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="${big ? 3 : 2.2}" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

function trendOf(arr) {
  if (arr.length < 2) return null;
  const a = arr[arr.length - 2].ps, b = arr[arr.length - 1].ps;
  return (b - a) / a * 100;
}
function trendChip(t) {
  if (t == null) return h('span', { class: 'trend flat', text: 'одна покупка' });
  if (Math.abs(t) < 0.5) return h('span', { class: 'trend flat', text: '= без изменений' });
  return h('span', { class: 'trend ' + (t > 0 ? 'up' : 'down'), text: (t > 0 ? '↑ +' : '↓ −') + Math.round(Math.abs(t)) + '%' });
}

function priceDetail(p) {
  const arr = pricesOf(p.id);
  const vals = arr.map(x => dispPrice(x.ps, p.unit));
  const avg = vals.reduce((s, x) => s + x, 0) / vals.length;
  const all = (S.purchases || []).filter(x => x.product === p.id).sort((a, b) => b.when.localeCompare(a.when));
  const spent = all.reduce((s, x) => s + (x.total || 0), 0);
  modal({
    title: `${emo(p.name)} ${displayName(p.name)}`,
    wide: true,
    body: h('div', { class: 'form' },
      h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('div', {}, h('b', { text: money(vals[vals.length - 1]) }), h('span', { class: 'l', text: 'последняя цена за ' + perLbl(p.unit) }))),
        h('div', { class: 'stat' }, h('div', {}, h('b', { text: money(avg) }), h('span', { class: 'l', text: `средняя, от ${money(Math.min(...vals))} до ${money(Math.max(...vals))}` }))),
        h('div', { class: 'stat' }, h('div', {}, h('b', { text: money(spent) }), h('span', { class: 'l', text: 'потрачено всего' })))),
      vals.length > 1 ? h('div', { class: 'bigchart', html: sparkSvg(vals, 600, 180, true) }) : null,
      h('div', { class: 'tablewrap' }, h('table', { class: 'hist' },
        h('thead', {}, h('tr', {}, h('th', { text: 'Дата' }), h('th', { class: 'num', text: 'Купили' }), h('th', { class: 'num', text: 'Сумма' }), h('th', { class: 'num', text: 'За ' + perLbl(p.unit) }))),
        h('tbody', {}, all.map(x => h('tr', {},
          h('td', { text: x.when.slice(8, 10) + '.' + x.when.slice(5, 7) + '.' + x.when.slice(2, 4) }),
          h('td', { class: 'num', text: qtyStr(x.qty, x.unit) }),
          h('td', { class: 'num', text: x.total != null ? money(x.total) : '—' }),
          h('td', { class: 'num', text: x.price ? money(dispPrice(x.price / (FACT[x.unit] || 1), p.unit)) : '—' }))))))),
    cancelText: 'Закрыть', noOk: true,
    extra: { text: '＋ Приход', onClick: () => restockForm(p) }
  });
}

function renderPrices(v) {
  const purchases = S.purchases || [];
  const now = new Date();
  const sinceStr = daysAgoStr(30);
  const recent = purchases.filter(x => x.when.slice(0, 10) >= sinceStr && x.total != null);
  const spent30 = recent.reduce((s, x) => s + x.total, 0);

  const items = S.products.map(p => { const arr = pricesOf(p.id); return { p, arr, t: trendOf(arr) }; }).filter(x => x.arr.length);
  const upCount = items.filter(x => x.t != null && x.t >= 0.5).length;

  v.append(h('div', { class: 'toolbar' },
    h('div', { class: 'grow' }, h('h2', { text: 'Цены и расходы' }),
      h('div', { class: 'muted', text: 'Считаю по суммам, которые вы указываете при приходе' }))));

  v.append(h('div', { class: 'stats' },
    h('div', { class: 'stat' }, h('div', { class: 'si c', text: '💸' }), h('div', {}, h('b', { text: money(spent30) }), h('span', { class: 'l', text: 'потрачено за 30 дней' }))),
    h('div', { class: 'stat' }, h('div', { class: 'si a', text: '🧾' }), h('div', {}, h('b', { text: recent.length }), h('span', { class: 'l', text: 'покупок за 30 дней' }))),
    h('div', { class: 'stat' }, h('div', { class: 'si b', text: '📈' }), h('div', {}, h('b', { text: upCount }), h('span', { class: 'l', text: 'продуктов подорожало' })))));

  if (!purchases.some(x => x.total != null)) {
    v.append(h('div', { class: 'empty' }, h('span', { class: 'big', text: '💰' }), 'Указывайте сумму при приходе продуктов — здесь появятся цены и расходы по месяцам.'));
    return;
  }

  // расходы по месяцам
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, label: MONTHS_NOM[d.getMonth()], sum: 0 }); }
  purchases.forEach(x => { if (x.total != null) { const m = months.find(mm => mm.key === x.when.slice(0, 7)); if (m) m.sum += x.total; } });
  const maxM = Math.max(1, ...months.map(m => m.sum));
  v.append(h('h3', { text: 'Расходы по месяцам', style: 'margin-bottom:12px' }));
  v.append(h('div', { class: 'months' }, months.map((m, i) => h('div', { class: 'mcol' + (i === 5 ? ' cur' : '') },
    h('span', { class: 'mv', text: m.sum ? Math.round(m.sum / 1000) + 'k' : '' }),
    h('div', { class: 'mbar', style: `height:${Math.max(2, m.sum / maxM * 100)}%`, title: money(m.sum) }),
    h('span', { class: 'ml', text: m.label })))));

  // цены по продуктам
  const host = h('div');
  const chips = h('div', { class: 'scroller' });
  const draw = () => {
    host.replaceChildren();
    const qs = q.prices.trim().toLowerCase();
    const list = items.filter(x => (!qs || x.p.name.toLowerCase().includes(qs)) &&
      (priceFilter === 'all' || (priceFilter === 'up' ? x.t != null && x.t >= 0.5 : x.t != null && x.t <= -0.5)))
      .sort((a, b) => priceFilter === 'all' ? byName(a.p, b.p) : Math.abs(b.t) - Math.abs(a.t));
    if (!list.length) { host.className = ''; host.append(h('div', { class: 'empty', text: 'Ничего не найдено.' })); return; }
    host.className = 'prices';
    list.forEach(x => {
      const vals = x.arr.map(a => dispPrice(a.ps, x.p.unit));
      host.append(h('button', { class: 'price-card', onclick: () => priceDetail(x.p) },
        h('div', { class: 'em-badge', text: emo(x.p.name) }),
        h('div', { class: 'mid' },
          h('div', { style: 'font-weight:700' , text: displayName(x.p.name) }),
          h('div', { class: 'pv' }, money(vals[vals.length - 1]), h('small', { text: ' /' + perLbl(x.p.unit) }))),
        h('div', { class: 'spark' }, vals.length > 1 ? h('span', { html: sparkSvg(vals, 96, 34) }) : null, trendChip(x.t))));
    });
  };
  const drawChips = () => chips.replaceChildren(...[['all', 'Все'], ['up', 'Подорожали'], ['down', 'Подешевели']]
    .map(([k, t]) => h('button', { class: 'fchip' + (priceFilter === k ? ' on' : ''), onclick: () => { priceFilter = k; drawChips(); draw(); } }, t)));
  drawChips();
  v.append(h('section', { class: 'block' },
    h('div', { class: 'sec-head' }, h('h3', { text: 'Цены на продукты' }),
      h('input', { type: 'search', placeholder: '🔍 Найти', value: q.prices, 'aria-label': 'Поиск по ценам', oninput: e => { q.prices = e.target.value; draw(); } })),
    chips, host));
  draw();
  const noPrice = S.products.filter(p => !pricesOf(p.id).length);
  if (noPrice.length) v.append(h('p', { class: 'muted small', style: 'margin-top:14px', text: 'Пока без цены: ' + noPrice.map(p => displayName(p.name)).join(', ') }));
}

function helpBlock(b) {
  if (typeof b === 'string') return h('p', { text: b });
  if (b.ul) return h('ul', {}, b.ul.map(x => h('li', { text: x })));
  if (b.ol) return h('ol', {}, b.ol.map(x => h('li', { text: x })));
  if (b.h) return h('h4', { text: b.h });
  if (b.tip) return h('div', { class: 'tip' }, '💡 ' + b.tip);
  if (b.ex) return h('div', { class: 'ex' }, b.ex);
  if (b.keys) return h('div', { class: 'keys' }, b.keys.map(([k, t]) => [h('b', { text: k }), h('span', { text: t })]));
  return null;
}
const helpText = s => (s.title + ' ' + JSON.stringify(s.body)).toLowerCase().replace(/ё/g, 'е');

function renderHelp(v) {
  const secs = h('div');
  const toc = h('div', { class: 'scroller' });
  const search = h('input', { type: 'search', placeholder: '🔍 Найти в помощи', 'aria-label': 'Поиск в помощи', value: q.help || '' });
  const nodes = {};
  HELP.forEach(s => {
    const d = h('details', { class: 'hs', id: 'help-' + s.id, open: !!s.open },
      h('summary', {}, h('span', { class: 'hs-ico', text: s.ico }), h('span', { text: s.title })),
      h('div', { class: 'hs-body' }, s.body.map(helpBlock)));
    nodes[s.id] = d;
    secs.append(d);
  });
  const go = id => { const d = nodes[id]; if (!d) return; d.hidden = false; d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  toc.append(...HELP.map(s => h('button', { class: 'fchip', onclick: () => go(s.id) }, s.ico + ' ' + s.title.split(':')[0])));
  const empty = h('div', { class: 'empty', hidden: true }, h('span', { class: 'big', text: '🔍' }), 'В помощи такого нет. Попробуйте другое слово.');
  const filter = () => {
    q.help = search.value;
    const qs = search.value.trim().toLowerCase().replace(/ё/g, 'е');
    let shown = 0;
    HELP.forEach(s => {
      const hit = !qs || helpText(s).includes(qs);
      nodes[s.id].hidden = !hit;
      if (qs && hit) nodes[s.id].open = true;
      if (hit) shown++;
    });
    empty.hidden = shown > 0;
  };
  search.addEventListener('input', filter);
  v.append(
    h('div', { class: 'help-hero' },
      h('span', { class: 'hand', text: 'Помощь' }),
      h('h2', { text: 'Как пользоваться «Домашней кухней»' }),
      h('div', { class: 'muted', text: 'Нажмите на тему, чтобы открыть. Или найдите по слову — например, «порции» или «остатки».' }),
      search),
    toc, secs, empty);
  filter();
}

const fmtMin = m => m >= 60 ? Math.floor(m / 60) + ' ч' + (m % 60 ? ' ' + (m % 60) + ' мин' : '') : m + ' мин';
function dateOfDay(C, d) {
  const p = C.week.split('-').map(Number);
  const x = new Date(p[0], p[1] - 1, p[2] + d - 1);
  return x.getDate() + ' ' + MONTHS[x.getMonth()];
}

function cleanLoadErr(e) {
  const m = String((e && e.message) || e);
  if (/clean_get|clean_save|schema cache|does not exist|Could not find/i.test(m)) return 'Раздел «Уборка» ещё не подключён к базе. Нужно один раз выполнить файл 003_clean.sql в Supabase (SQL Editor).';
  return cleanErr(e);
}

/** Загрузить «Уборку». Ошибка не ломает кухню: она показывается только в разделе «Уборка». */
async function cleanLoad() {
  if (!CST) return;
  try { CS = await CST.load(); CERR = ''; } catch (e) {
    CS = null; CERR = cleanLoadErr(e);
    if (CERR === 'Войдите заново') { sessionLost(); return; }
  }
  if (S) render();
}

/** Действие в «Уборке»: записать и перерисовать. Возвращает состояние или null (ошибка уже показана). */
async function cact(name, ...args) {
  document.body.classList.add('busy');
  try {
    const r = await CST.act(name, ...args);
    CS = r.state;
    ymAction(name, args);
    if (r.notice) toast(r.notice);
    render();
    return CS;
  } catch (e) {
    const m = cleanLoadErr(e);
    if (m === 'Войдите заново') { sessionLost(); return null; }
    toast(m, 'bad');
    return null;
  } finally {
    document.body.classList.remove('busy');
  }
}

  return d === 6 ? ['✨', 'Мелочи по дому'] : C.themes[d];
}

function cWeek(v, C) {
  if (cDay == null) cDay = C.today;
  const T = id => C.tasks.find(t => t.id === id);
  const pct = C.totalMin ? Math.round(C.doneMin / C.totalMin * 100) : 0;
  const restTxt = C.days.filter(d => d.rest).map(d => CDAYS[d.day]).join(', ');
  v.append(h('div', { class: 'chead' },
    h('span', { class: 'hand', text: 'Уборка' }),
    h('h2', { text: 'План на неделю' }),
    h('div', { class: 'muted', text: fmtMin(C.totalMin) + ' за неделю · сделано ' + pct + '%' + (restTxt ? ' · выходной: ' + restTxt : '') }),
    h('div', { class: 'cprog' }, h('i', { style: 'width:' + pct + '%' }))));
  if (C.low.length) v.append(h('div', { class: 'lowbar' }, '🧴 Заканчивается: ' + C.low.map(x => x.name).join(', ') + ' ', h('button', { class: 'btn sm', onclick: () => { ctab = 'supplies'; render(); } }, 'Смотреть')));

  v.append(h('div', { class: 'cdays', role: 'group', 'aria-label': 'Дни недели' }, C.days.map(d => {
    const list = d.ids.map(T), all = list.length && list.every(t => t.done);

const pickMeta = (C, p, mode) => {
  const bits = [p.min + ' мин'];
  if (p.times > 1) bits.push(p.times + ' р/нед');
  const own = mode === 'themes' ? p.days.filter(d => C.settings.rest.indexOf(d) < 0) : [];
  bits.push(own.length ? own.map(d => CDAYS[d]).join(', ') + (own.length < p.times ? ' + 🎲' : '') : '🎲');
  return bits.join(' · ');
};

/** Шторка дела: минуты, сколько раз в неделю и в какие дни (дней — не больше, чем раз); «Не делаю». */
function pickSheet(C, p) {
  const t = C.catalog.find(x => x.id === p.id);
  const cur = { min: p.min, times: p.times };
  let order = p.days.slice();          // выбранные дни в порядке нажатия: лишний вытесняет самый ранний
  const themed = C.settings.mode === 'themes';
  const rest = C.settings.rest;
  const seg = (key, items, after) => {
    const box = h('div', { class: 'cseg' });
    const draw = () => box.replaceChildren(...items.map(([val, lbl]) => h('button', { type: 'button', class: cur[key] === val ? 'on' : '', 'aria-pressed': String(cur[key] === val), onclick: () => { cur[key] = val; draw(); if (after) after(); } }, lbl)));
    draw();
    return box;
  };
  const daysHint = h('div', { class: 'muted small' });
  const anyBtn = h('div', { class: 'cseg' });
  const daysBox = h('div', { class: 'cseg days' });
  const drawDays = () => {
    order = order.slice(-cur.times);
    daysHint.textContent = (cur.times === 1 ? 'Можно отметить 1 день' : 'Можно отметить до ' + cur.times + ' дней') + ' · выбрано ' + order.length + ' из ' + cur.times
      + (order.length < cur.times ? '. Остальное разложу сама 🎲' : '');
    anyBtn.replaceChildren(h('button', { type: 'button', class: order.length ? '' : 'on', 'aria-pressed': String(!order.length), onclick: () => { order = []; drawDays(); } }, '🎲 Любые — выберет приложение'));
    daysBox.replaceChildren(
      ...[1, 2, 3, 4, 5, 6, 7].map(d => {
        const on = order.indexOf(d) >= 0, off = rest.indexOf(d) >= 0;
        return h('button', { type: 'button', class: (on ? 'on' : '') + (off ? ' off' : ''), disabled: off, 'aria-pressed': String(on), 'aria-label': CDAYS_FULL[d] + (off ? ', выходной' : ''), onclick: () => {
          if (on) order = order.filter(x => x !== d);
          else { order.push(d); if (order.length > cur.times) order.shift(); }
          drawDays();
        } }, CDAYS[d]);
      }));
  };
  drawDays();
  const mins = CleanLogic.MINUTES.indexOf(p.min) >= 0 ? CleanLogic.MINUTES : CleanLogic.MINUTES.concat(p.min).sort((a, b) => a - b);
  modal({
    title: t.emo + ' ' + t.name,

      themed ? [h('b', { text: 'В какие дни' }), daysBox, anyBtn, daysHint] : h('div', { class: 'warnline', text: 'В режиме «Всё вперемешку» дни выбирает приложение.' })),
    extra: { text: p.on ? 'Не делаю' : 'Делаю', cls: 'ghost', onClick: async () => { if (await cact('savePick', { id: p.id, on: !p.on })) $('#dlg').close(); } },
    okText: 'Сохранить',
    onOk: async () => ((await cact('savePick', Object.assign({ id: p.id, on: true, min: cur.min, times: cur.times }, themed ? { days: order.slice(-cur.times) } : {}))) ? true : false)
  });
}

let enterNext = false, prevDone = null;
/* ───── Модуль «Дети» ───── */
let ktab = 'today';
let kWhen = null;         // 'today' | 'tomorrow' на экране «Сегодня» (по умолчанию вечером — завтра)
let kDay = null;          // выбранный день на экране «Неделя»
let kDraft = null;        // первый запуск: { kids:[{name, kind, tpls:[]}] }
let KS = null;            // вычисленное состояние «Детей»
let KERR = '';            // почему «Дети» не загрузились
let KST = null;           // хранилище (clean-store.js с kids_get / kids_save)
const kTicks = new Set(); // отмеченные вещи «Взять с собой» (только на этом телефоне, до перезагрузки)
const KDAYS = ['', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const KDAYS_FULL = ['', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

function kDate(s, withDay) {
  const p = s.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const idx = (d.getDay() + 6) % 7 + 1;
  return (withDay ? KDAYS[idx] + ', ' : '') + d.getDate() + ' ' + MONTHS[d.getMonth()];
}
const kIn = n => n === 0 ? 'сегодня' : n === 1 ? 'завтра' : n === 2 ? 'послезавтра' : 'через ' + n + ' дн.';

function kidsLoadErr(e) {
  const m = String((e && e.message) || e);
  if (/kids_get|kids_save|schema cache|does not exist|Could not find/i.test(m)) return 'Раздел «Дети» ещё не подключён к базе. Нужно один раз выполнить файл 004_kids.sql в Supabase (SQL Editor).';
  return cleanErr(e);
}

/** Загрузить «Детей». Ошибка не ломает кухню и уборку: она видна только в разделе «Дети». */
async function kidsLoad() {
  if (!KST) return;
  try { KS = await KST.load(); KERR = ''; } catch (e) {
    KS = null; KERR = kidsLoadErr(e);
    if (KERR === 'Войдите заново') { sessionLost(); return; }
  }
  if (S) render();
}

/** Действие в «Детях»: записать и перерисовать. Возвращает состояние или null (ошибка уже показана). */
async function kact(name, ...args) {
  document.body.classList.add('busy');
  try {
    const r = await KST.act(name, ...args);
    KS = r.state;
    ymAction(name, args);
    if (r.notice) toast(r.notice, 'good');
    render();
    return KS;
  } catch (e) {
    const m = kidsLoadErr(e);
    if (m === 'Войдите заново') { sessionLost(); return null; }
    toast(m, 'bad');
    return null;
  } finally {
    document.body.classList.remove('busy');
  }
}

function renderKids(v) {
  const K = KS;
  if (ktab === 'help') return renderHelp(v);
  if (!K) {
    if (KERR) {
      v.append(h('div', { class: 'empty' }, h('span', { class: 'big', text: '😕' }), KERR,
        h('button', { class: 'btn', style: 'margin-top:12px', onclick: () => { KERR = ''; render(); kidsLoad(); } }, 'Повторить')));
    } else v.append(h('div', { class: 'empty' }, h('span', { class: 'big', text: '🎒' }), 'Загружаю расписание детей…'));
    return;
  }
  if (!K.ready) return kSetup(v, K);
  ({ today: kToday, week: kWeek, events: kEvents, kids: kKids })[ktab](v, K);
}

/** Полоска-напоминание вверху (в «Кухне» и «Уборке»): вечером — что собрать на завтра, днём — на сегодня. */

  const b = $('#kbanner');

/** Карточка занятия или события на дату: время, место, кто отвозит, вещи, «✓ Собрано». */
function kItemCard(it) {
  const meta = [it.time, it.place, it.driver ? 'отвозит ' + it.driver : ''].filter(Boolean).join(' · ');
  const tickKey = x => it.date + '|' + it.key + '|' + x;
  const bring = it.bring.length ? h('div', { class: 'kbring' }, it.bring.map(x => {
    const on = it.packed || kTicks.has(tickKey(x));
    return h('button', { type: 'button', class: 'kthing' + (on ? ' on' : ''), 'aria-pressed': String(on), disabled: it.packed,
      onclick: () => { if (kTicks.has(tickKey(x))) kTicks.delete(tickKey(x)); else kTicks.add(tickKey(x)); render(); } }, (on ? '✓ ' : '') + x);
  })) : null;
  const pastDay = it.date < KS.today;
  return h('div', { class: 'ctask kitem' + (it.packed ? ' done' : '') },
    h('div', { class: 'ct-ico', text: it.emo }),
    h('div', { class: 'ct-main' },
      h('b', { text: (it.packed ? '✓ ' : '') + it.name + (it.kidName ? ' · ' + it.kidName : '') }),
      meta ? h('span', { class: 'muted small', text: meta }) : null,
      it.kind === 'event' ? h('span', { class: 'ct-chips' }, h('span', { class: 'chip warn', text: KS.eventTypes[it.type][1] })) : null),
    bring ? h('div', { class: 'kb-wrap' }, h('span', { class: 'muted small', text: 'Взять с собой:' }), bring) : null,
    pastDay ? null : h('div', { class: 'ct-act' },
      it.packed
        ? h('button', { class: 'btn ghost', onclick: () => kact('pack', it.key, it.date, false) }, '↩️ Ещё не собрано')
        : h('button', { class: 'btn primary', onclick: async () => { const st = await kact('pack', it.key, it.date, true); if (st) toast('Собрано! 🎒', 'good'); } }, it.bring.length ? '✓ Собрано' : '✓ Готово'),
      h('button', { class: 'btn ghost', 'aria-label': 'Изменить', onclick: () => it.kind === 'act' ? kActSheet(KS.acts.find(a => a.id === it.id)) : kEventSheet(KS.events.find(e => e.id === it.id)) }, '✏️')));
}

function kToday(v, K) {
  if (!kWhen) kWhen = Number(K.time.slice(0, 2)) >= KidsLogic.EVENING_HOUR ? 'tomorrow' : 'today';
  const tom = kWhen === 'tomorrow';
  const date = tom ? K.tomorrow : K.today;
  const items = tom ? K.tomorrowItems : K.todayItems;
  const left = items.filter(i => !i.packed).length;
  v.append(h('div', { class: 'chead' },
    h('span', { class: 'hand', text: tom ? 'Собираемся с вечера' : 'Дети' }),
    h('h2', { text: (tom ? 'Завтра, ' : 'Сегодня, ') + kDate(date) }),
    h('div', { class: 'muted', text: items.length ? (left ? 'Осталось собрать: ' + left + ' из ' + items.length : 'Всё собрано 👍') : 'Занятий нет' })));
  v.append(h('div', { class: 'seg', role: 'group', 'aria-label': 'День', style: 'margin-bottom:14px' },
    h('button', { class: !tom ? 'on' : '', 'aria-pressed': String(!tom), onclick: () => { kWhen = 'today'; render(); } }, 'Сегодня'),
    h('button', { class: tom ? 'on' : '', 'aria-pressed': String(tom), onclick: () => { kWhen = 'tomorrow'; render(); } }, 'Завтра')));
  if (!items.length) v.append(h('div', { class: 'empty' }, h('span', { class: 'big', text: '🌿' }), 'Свободный день — ни кружков, ни событий.'));
  items.forEach(it => v.append(kItemCard(it)));
  const soon = K.upcoming.filter(e => e.in > (tom ? 1 : 0) && e.in <= 14);
  if (soon.length) {
    v.append(h('div', { class: 'zone', text: '📅 Скоро' }));
    soon.slice(0, 5).forEach(e => v.append(kEventRow(e)));
  }
  v.append(h('div', { class: 'kadd' },
    h('button', { class: 'btn', onclick: () => kTplPicker() }, '＋ Занятие'),
    h('button', { class: 'btn', onclick: () => kEventSheet(null, date) }, '＋ Событие')));
}

function kWeek(v, K) {
  if (kDay == null) kDay = K.todayIdx;
  v.append(h('div', { class: 'chead' }, h('span', { class: 'hand', text: 'Расписание' }), h('h2', { text: 'Неделя детей' }),
    h('div', { class: 'muted', text: kDate(K.monday) + ' – ' + kDate(KidsLogic.addDays(K.monday, 6)) })));
  v.append(h('div', { class: 'cdays', role: 'group', 'aria-label': 'Дни недели' }, K.week.map(d => {
    const n = d.items.length, past = d.date < K.today;
    return h('button', { class: 'cd' + (d.day === kDay ? ' sel' : '') + (d.date === K.today ? ' today' : '') + (past ? ' rest' : ''), 'aria-pressed': String(d.day === kDay),
      'aria-label': KDAYS_FULL[d.day] + ', занятий: ' + n, onclick: () => { kDay = d.day; render(); } },
      h('b', { text: KDAYS[d.day] }), h('span', { class: 'em', text: n ? (d.items.every(i => i.packed) ? '✅' : d.items[0].emo) : '🌿' }), h('small', { text: n ? n + ' зан.' : 'свободно' }));
  })));
  const d = K.week[kDay - 1];
  v.append(h('div', { class: 'cday-head' }, h('h3', { text: KDAYS_FULL[d.day] + ', ' + kDate(d.date) })));
  if (!d.items.length) v.append(h('div', { class: 'empty' }, h('span', { class: 'big', text: '🌿' }), 'В этот день занятий нет.'));
  d.items.forEach(it => v.append(kItemCard(it)));
}

function kEventRow(e) {
  return h('button', { type: 'button', class: 'pick-row', onclick: () => kEventSheet(KS.events.find(x => x.id === e.id)) },
    h('span', { class: 'em', text: e.emo }),
    h('span', { class: 'nm' }, e.name, h('br'), h('small', { class: 'muted', text: kDate(e.when, true) + (e.time ? ' · ' + e.time : '') + (e.kidName ? ' · ' + e.kidName : '') })),
    h('span', { class: 'chip' + (e.in <= e.remind ? ' warn' : ''), text: kIn(e.in) }));
}

function kEvents(v, K) {
  v.append(h('div', { class: 'chead' }, h('span', { class: 'hand', text: 'Не забыть' }), h('h2', { text: 'События' }),
    h('div', { class: 'muted', text: 'Врач, собрание, утренник, день рождения. Напомню заранее — полоской вверху.' })));
  v.append(h('button', { class: 'btn primary wide', style: 'min-height:52px;margin-bottom:14px', onclick: () => kEventSheet(null) }, '＋ Добавить событие'));
  if (!K.upcoming.length) { v.append(h('div', { class: 'empty' }, h('span', { class: 'big', text: '📅' }), 'Пока ничего не запланировано.')); return; }
  v.append(h('div', { class: 'pick-list' }, K.upcoming.map(kEventRow)));
}

function kKids(v, K) {
  v.append(h('div', { class: 'chead' }, h('span', { class: 'hand', text: 'Семья' }), h('h2', { text: 'Дети и занятия' }),
    h('div', { class: 'muted', text: 'Нажмите на занятие, чтобы поменять дни, время, кто отвозит и что взять.' })));
  K.kids.forEach(k => {
    const acts = K.acts.filter(a => a.kid === k.id);
    v.append(h('div', { class: 'cbox' },
      h('div', { class: 'row sp' }, h('b', { style: 'font-size:18px', text: k.emo + ' ' + k.name + (k.kindName ? ' · ' + k.kindName : '') }),
        h('button', { class: 'icon-act', 'aria-label': 'Изменить: ' + k.name, onclick: () => kKidSheet(k) }, '✏️')),
      acts.length ? h('div', { class: 'pick-list' }, acts.map(a => h('button', { type: 'button', class: 'pick-row', onclick: () => kActSheet(a) },
        h('span', { class: 'em', text: a.emo }),
        h('span', { class: 'nm' }, a.name, h('br'), h('small', { class: 'muted', text: a.days.map(d => KDAYS[d]).join(', ') + (a.time ? ' · ' + a.time : '') + (a.driver ? ' · ' + a.driver : '') })))))
        : h('p', { class: 'muted small', text: 'Занятий пока нет.' }),
      h('button', { class: 'btn', onclick: () => kTplPicker(k.id) }, '＋ Занятие')));
  });
  const other = K.acts.filter(a => !a.kid);
  if (other.length) v.append(h('div', { class: 'cbox' }, h('b', { text: '👨‍👩‍👧 Для всей семьи' }),
    h('div', { class: 'pick-list' }, other.map(a => h('button', { type: 'button', class: 'pick-row', onclick: () => kActSheet(a) }, h('span', { class: 'em', text: a.emo }), h('span', { class: 'nm', text: a.name }))))));
  v.append(h('button', { class: 'btn wide', style: 'min-height:50px;margin-bottom:12px', onclick: () => kKidSheet(null) }, '＋ Ребёнок'));
  const inp = h('input', { type: 'text', placeholder: 'Например, Бабушка', maxlength: '30' });
  v.append(h('div', { class: 'cbox' }, h('b', { text: '🚗 Кто отвозит' }),
    h('div', { class: 'row' }, K.people.map(p => h('button', { type: 'button', class: 'fchip on', 'aria-label': 'Убрать: ' + p, onclick: async () => {
      if (K.people.length <= 1) { toast('Оставьте хотя бы одного человека.', 'bad'); return; }
      if (await confirmBox('Убрать «' + p + '» из списка? В уже сохранённых занятиях имя останется.', 'Убрать')) kact('savePeople', K.people.filter(x => x !== p));
    } }, p + ' ×'))),
    h('div', { class: 'row' }, h('div', { style: 'flex:1;min-width:0' }, inp),
      h('button', { class: 'btn', onclick: () => { const p = inp.value.trim(); if (p) kact('savePeople', K.people.concat(p)); } }, 'Добавить'))));
}

/* ───── первый запуск ───── */
function kTplFor(kind) { return kind === 'school' ? ['school'] : kind === 'kg' ? ['kg'] : []; }
function kSetup(v, K) {
  if (!kDraft) kDraft = { kids: [{ name: '', kind: 'school', tpls: ['school'] }] };
  const D = kDraft;
  v.append(h('div', { class: 'chead' }, h('span', { class: 'hand', text: 'Давайте познакомимся' }), h('h2', { text: 'Кто у вас?' }),
    h('div', { class: 'muted', text: 'Имя и куда ходит. Отметьте кружки — я сама впишу дни, время и что взять с собой. Всё можно поменять потом.' })));
  D.kids.forEach((k, i) => {
    const name = h('input', { type: 'text', value: k.name, placeholder: 'Имя', maxlength: '40', autocapitalize: 'words', oninput: e => { k.name = e.target.value; } });
    const setKind = kind => { k.kind = kind; k.tpls = k.tpls.filter(t => t !== 'school' && t !== 'kg').concat(kTplFor(kind)); render(); };
    v.append(h('div', { class: 'cbox' },
      h('div', { class: 'row sp' }, h('b', { text: (KidsLogic.KID_EMO[i % 5]) + ' Ребёнок ' + (D.kids.length > 1 ? i + 1 : '') }),
        D.kids.length > 1 ? h('button', { class: 'icon-act', 'aria-label': 'Убрать', onclick: () => { D.kids.splice(i, 1); render(); } }, '×') : null),
      h('div', { class: 'form' }, field('Имя', name)),
      h('div', { class: 'seg', role: 'group', 'aria-label': 'Куда ходит' }, [['school', '🏫 Школа'], ['kg', '🧸 Садик'], ['', 'Ещё нет']].map(([id, lbl]) =>
        h('button', { class: k.kind === id ? 'on' : '', 'aria-pressed': String(k.kind === id), onclick: () => setKind(id) }, lbl))),
      h('span', { class: 'muted small', text: 'Кружки:' }),
      h('div', { class: 'row' }, K.templates.filter(t => !t.for).map(t => {
        const on = k.tpls.indexOf(t.id) >= 0;
        return h('button', { type: 'button', class: 'fchip' + (on ? ' on' : ''), 'aria-pressed': String(on), onclick: () => { if (on) k.tpls = k.tpls.filter(x => x !== t.id); else k.tpls.push(t.id); render(); } }, (on ? '✓ ' : '') + t.emo + ' ' + t.name);
      }))));
  });
  if (D.kids.length < 8) v.append(h('button', { class: 'btn wide', style: 'min-height:48px;margin-bottom:12px', onclick: () => { D.kids.push({ name: '', kind: 'school', tpls: ['school'] }); render(); } }, '＋ Ещё ребёнок'));
  const n = D.kids.reduce((a, k) => a + k.tpls.length, 0);
  v.append(h('button', { class: 'btn primary wide', style: 'min-height:54px;font-size:17px', onclick: async () => {
    const kids = D.kids.filter(k => k.name.trim());
    if (!kids.length) { toast('Напишите имя хотя бы одного ребёнка.', 'bad'); return; }
    const picks = [];
    kids.forEach((k, i) => k.tpls.forEach(tpl => picks.push({ kid: i, tpl })));
    const st = await kact('setup', kids.map(k => ({ name: k.name, kind: k.kind })), picks);
    if (st) { kDraft = null; ktab = 'today'; kWhen = null; render(); window.scrollTo(0, 0); }
  } }, 'Готово' + (n ? ' · ' + n + ' зан.' : '')));
}

/* ───── шторки ───── */
const kTimeInput = v => h('input', { type: 'time', value: v || '', step: '300' });
function kKidSelect(cur, allowFamily) {
  const s = h('select', {}, allowFamily ? h('option', { value: '', text: '👨‍👩‍👧 Вся семья' }) : null,
    KS.kids.map(k => h('option', { value: k.id, text: k.emo + ' ' + k.name, selected: k.id === cur })));
  if (!allowFamily && !cur && KS.kids[0]) s.value = KS.kids[0].id;
  return s;
}
/** Кнопки «Кто отвозит»: один выбор или никто. Возвращает { el, get }. */
function kDriverPick(cur) {
  let val = cur || '';
  const wrap = h('div', { class: 'cseg' });
  const draw = () => wrap.replaceChildren(...['', ...KS.people].map(p => h('button', { type: 'button', class: val === p ? 'on' : '', 'aria-pressed': String(val === p), onclick: () => { val = p; draw(); } }, p || 'Никто')));
  draw();
  return { el: wrap, get: () => val };
}

/** Выбор: шаблон занятия или своё. */
function kTplPicker(kid) {
  modal({
    title: '＋ Занятие', noOk: true,
    body: h('div', { class: 'pick-list' },
      KS.templates.map(t => h('button', { type: 'button', class: 'pick-row', onclick: () => kActSheet(null, { kid, name: t.name, emo: t.emo, days: t.days, time: t.time, bring: t.bring, driver: KS.people[0] || '' }) },
        h('span', { class: 'em', text: t.emo }), h('span', { class: 'nm' }, t.name, h('br'), h('small', { class: 'muted', text: t.bring.slice(0, 3).join(', ') + (t.bring.length > 3 ? '…' : '') })))),
      h('button', { type: 'button', class: 'pick-row', onclick: () => kActSheet(null, { kid, name: '', emo: '📌', days: [], time: '', bring: [], driver: KS.people[0] || '' }) },
        h('span', { class: 'em', text: '✏️' }), h('span', { class: 'nm', text: 'Своё занятие' })))
  });
}

/** Занятие: a — существующее или null; pre — заготовка из шаблона. */
function kActSheet(a, pre) {
  if (!a && !KS.kids.length) { toast('Сначала добавьте ребёнка.', 'bad'); return; }
  const src = a || pre || {};
  const kid = kKidSelect(src.kid || '', false);
  const name = h('input', { type: 'text', value: src.name || '', placeholder: 'Например, Бассейн', maxlength: '60' });
  let days = (src.days || []).slice();
  const daysEl = h('div', { class: 'cseg days' });
  const drawDays = () => daysEl.replaceChildren(...[1, 2, 3, 4, 5, 6, 7].map(d => h('button', { type: 'button', class: days.indexOf(d) >= 0 ? 'on' : '', 'aria-pressed': String(days.indexOf(d) >= 0),
    onclick: () => { const i = days.indexOf(d); if (i >= 0) days.splice(i, 1); else days.push(d); drawDays(); } }, KDAYS[d])));
  drawDays();
  const time = kTimeInput(src.time);
  const place = h('input', { type: 'text', value: src.place || '', placeholder: 'Необязательно', maxlength: '80' });
  const driver = kDriverPick(src.driver);
  const bring = h('textarea', { rows: '4', placeholder: 'Каждая вещь — с новой строки' });
  bring.value = (src.bring || []).join('\n');
  modal({
    title: (src.emo || '📌') + ' ' + (a ? 'Занятие' : 'Новое занятие'),
    body: h('div', { class: 'form' }, field('Ребёнок', kid), field('Название', name), field('Дни', daysEl), field('Время', time), field('Где', place),
      field('Кто отвозит', driver.el), field('Взять с собой', bring)),
    extra: a ? { text: '🗑 Удалить', cls: 'danger', onClick: async () => { if (await confirmBox('Удалить «' + a.name + '»? Оно пропадёт из расписания.', 'Удалить')) kact('deleteAct', a.id); } } : null,
    onOk: async () => !!(await kact('saveAct', { id: a ? a.id : '', kid: kid.value, name: name.value, emo: src.emo, days, time: time.value, place: place.value, driver: driver.get(), bring: bring.value }))
  });
}

/** Событие: e — существующее или null; date — дата по умолчанию. */
function kEventSheet(e, date) {
  const src = e || {};
  let type = src.type || 'doctor';
  const types = h('div', { class: 'cseg' });
  const name = h('input', { type: 'text', value: src.name || '', maxlength: '80' });
  const remind = h('select', {}, [0, 1, 2, 3, 7, 14].map(n => h('option', { value: String(n), text: n === 0 ? 'В тот же день' : 'За ' + n + ' дн.' })));
  remind.value = String(e ? src.remind : KS.eventTypes[type][2]);
  const ph = { doctor: 'Например, Стоматолог', meeting: 'Например, Родительское собрание', party: 'Например, Утренник', bday: 'Например, ДР Димы — подарок', other: 'Что за событие' };
  const drawTypes = () => {
    types.replaceChildren(...Object.keys(KS.eventTypes).map(t => h('button', { type: 'button', class: type === t ? 'on' : '', 'aria-pressed': String(type === t),
      onclick: () => { type = t; if (!e) remind.value = String(KS.eventTypes[t][2]); name.placeholder = ph[t]; drawTypes(); } }, KS.eventTypes[t][0] + ' ' + KS.eventTypes[t][1])));
    name.placeholder = ph[type];
  };
  drawTypes();
  const kid = kKidSelect(src.kid || '', true);
  const dt = h('input', { type: 'date', value: src.date || date || KS.tomorrow });
  const time = kTimeInput(src.time);
  const driver = kDriverPick(src.driver);
  const bring = h('textarea', { rows: '3', placeholder: 'Каждая вещь — с новой строки' });
  bring.value = (src.bring || []).join('\n');
  modal({
    title: e ? '✏️ Событие' : '＋ Событие',
    body: h('div', { class: 'form' }, field('Что', types), field('Название', name), field('Для кого', kid), field('Дата', dt, '— день рождения повторится каждый год'),
      field('Время', time), field('Кто отвозит', driver.el), field('Взять с собой', bring), field('Напомнить', remind)),
    extra: e ? { text: '🗑 Удалить', cls: 'danger', onClick: async () => { if (await confirmBox('Удалить «' + e.name + '»?', 'Удалить')) kact('deleteEvent', e.id); } } : null,
    onOk: async () => !!(await kact('saveEvent', { id: e ? e.id : '', kid: kid.value, date: dt.value, time: time.value, name: name.value || ph[type].replace(/^Например, /, ''), type, bring: bring.value, driver: driver.get(), remind: remind.value }))
  });
}

function kKidSheet(k) {
  const name = h('input', { type: 'text', value: k ? k.name : '', placeholder: 'Имя', maxlength: '40', autocapitalize: 'words' });
  let kind = k ? k.kind : 'school', emo = k ? k.emo : KidsLogic.KID_EMO[KS.kids.length % 5];
  const kinds = h('div', { class: 'cseg' }), emos = h('div', { class: 'cseg' });
  const draw = () => {
    kinds.replaceChildren(...[['school', '🏫 Школа'], ['kg', '🧸 Садик'], ['', 'Ещё нет']].map(([id, l]) => h('button', { type: 'button', class: kind === id ? 'on' : '', 'aria-pressed': String(kind === id), onclick: () => { kind = id; draw(); } }, l)));
    emos.replaceChildren(...KidsLogic.KID_EMO.map(x => h('button', { type: 'button', class: emo === x ? 'on' : '', 'aria-pressed': String(emo === x), 'aria-label': 'Значок ' + x, onclick: () => { emo = x; draw(); } }, x)));
  };
  draw();
  modal({
    title: k ? '✏️ ' + k.name : '＋ Ребёнок',
    body: h('div', { class: 'form' }, field('Имя', name), field('Куда ходит', kinds), field('Значок', emos)),
    extra: k ? { text: '🗑 Удалить', cls: 'danger', onClick: async () => { if (await confirmBox('Удалить ' + k.name + ' и все его занятия? События останутся — для всей семьи.', 'Удалить')) kact('deleteKid', k.id); } } : null,
    onOk: async () => !!(await kact('saveKid', { id: k ? k.id : '', name: name.value, emo, kind }))
  });
}

function render() {
  const clean = mod === 'clean', kids = mod === 'kids', kitchen = !clean && !kids;
  if (KST && KS) KS = KST.state() || KS;   // «сегодня», «вечер» и баннер считаются от текущего времени
  renderBanner();
  renderCBanner();
  renderKBanner();
  $('#navKitchen').hidden = !kitchen;
  $('#navClean').hidden = !clean;
  $('#navKids').hidden = !kids;
  $('#brandLogo').textContent = clean ? '🧽' : kids ? '🎒' : '🥘';
  $('#brandName').textContent = clean ? 'Уборка' : kids ? 'Дети' : 'Домашняя кухня';
  document.querySelectorAll('.mods button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.m === mod)));
  document.querySelectorAll('#navKitchen .tab').forEach(b => b.classList.toggle('on', kitchen && b.dataset.t === tab));
  document.querySelectorAll('#navClean .tab').forEach(b => b.classList.toggle('on', clean && b.dataset.c === ctab));
  document.querySelectorAll('#navKids .tab').forEach(b => b.classList.toggle('on', kids && b.dataset.k === ktab));
  const cur = clean ? ctab : kids ? ktab : tab;
  ymTrackView((clean ? 'clean/' : kids ? 'kids/' : 'kitchen/') + cur);
  $('#btnLog').hidden = !kitchen;
  $('#btnLog').classList.toggle('on', cur === 'log');
  $('#btnHelp').classList.toggle('on', cur === 'help');
  const v = $('#view');
  v.replaceChildren();
  v.classList.toggle('enter', enterNext);
  enterNext = false;
  if (clean) { renderClean(v); return; }
  if (kids) { renderKids(v); return; }
  ({ week: renderWeek, stock: renderStock, dishes: renderDishes, prices: renderPrices, log: renderLog, help: renderHelp })[tab](v);
  // «пружинка» у блюд, которые только что стали приготовленными (не при первой отрисовке и не при смене вкладки)
  const nowDone = new Set((S.plan || []).filter(i => i.done).map(i => i.id));
  if (prevDone) v.querySelectorAll('.item[data-id]').forEach(el => { if (nowDone.has(el.dataset.id) && !prevDone.has(el.dataset.id)) el.classList.add('just'); });
  prevDone = nowDone;
}

document.querySelectorAll('.mods button').forEach(b => b.addEventListener('click', () => { if (S && b.dataset.m !== mod) setMod(b.dataset.m); }));
document.querySelectorAll('#navClean .tab').forEach(b => b.addEventListener('click', () => {
  ctab = b.dataset.c; cDraft = null;
  if (S) { enterNext = true; render(); window.scrollTo(0, 0); }
}));
document.querySelectorAll('#navKids .tab').forEach(b => b.addEventListener('click', () => {
  ktab = b.dataset.k; kDay = null;
  if (S) { enterNext = true; render(); window.scrollTo(0, 0); }
}));
document.querySelectorAll('#navKitchen .tab').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.t;
  if (S) { enterNext = true; render(); window.scrollTo(0, 0); }
  touchMenu();
}));

/* ───── вход и запуск ───── */
function tzDate(withTime) {
  const p = {};
  new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Almaty', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  const d = p.year + '-' + p.month + '-' + p.day;
  return withTime ? d + ' ' + p.hour + ':' + p.minute : d;
}

function renderAuth(mode, opts) {
  opts = opts || {};
  const join = mode === 'join';
  document.body.classList.add('anon');
  $('#banner').hidden = true;
  const email = h('input', { class: 'ym-disable-keys', type: 'email', autocomplete: 'username', inputmode: 'email', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', placeholder: 'name@example.com' });
  const pass = h('input', { class: 'ym-disable-keys', type: 'password', autocomplete: join ? 'new-password' : 'current-password', placeholder: join ? 'Придумайте пароль (от 8 символов)' : 'Пароль' });
  const err = h('div', { class: 'warnline', role: 'alert', hidden: true });
  const show = h('button', { type: 'button', class: 'btn sm ghost', onclick: () => {
    pass.type = pass.type === 'password' ? 'text' : 'password';
    show.textContent = pass.type === 'password' ? '👁 показать пароль' : '🙈 скрыть пароль';
  } }, '👁 показать пароль');
  const go = h('button', { type: 'button', class: 'btn primary wide' }, join ? 'Создать аккаунт' : 'Войти');
  const submit = async () => {
    err.hidden = true;
    go.disabled = true;
    try {
      if (join) await Auth.signUp(email.value, pass.value, opts.token);
      else await Auth.signIn(email.value, pass.value);
      history.replaceState(null, '', location.pathname);
      await startApp();
    } catch (e) {
      err.textContent = cleanErr(e);
      err.hidden = false;
    } finally { go.disabled = false; }
  };
  go.addEventListener('click', submit);
  [email, pass].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }));
  $('#view').replaceChildren(h('div', { class: 'auth' },
    h('div', { class: 'hero' },
      h('div', { class: 'hero-emoji', text: '🥘' }),
      h('div', { class: 'hero-body' },
        h('span', { class: 'hand', text: join ? 'Вас пригласили!' : 'Добро пожаловать' }),
        h('h2', { text: join ? 'Домашняя кухня' : 'Домашняя кухня' }),
        join ? h('p', { class: 'muted', text: 'Придумайте пароль — и вы увидите общие продукты и меню семьи.' }) : null)),
    h('div', { class: 'card' },
      h('div', { class: 'form' }, field('Почта', email), field('Пароль', pass), show, err, go)),
    join
      ? h('p', { class: 'auth-note muted small' }, 'Уже есть аккаунт? ', h('a', { href: location.pathname, onclick: () => { history.replaceState(null, '', location.pathname); } }, 'Войти'))
      : h('p', { class: 'auth-note muted small', text: 'Нет аккаунта? Нужна ссылка-приглашение от того, кто уже пользуется приложением.' })));
}

function sessionLost() {
  S = null;
  renderAuth('login');
  toast('Войдите заново', 'bad');
}

/** Запись «Меню открыто» (не чаще раза в час) — по ней видно, как часто семья заглядывает в меню. Ошибки не показываем. */
function touchMenu() { if (tab === 'week' && window.API && S) API.touchMenu().catch(() => {}); }

let started = false;
async function startApp() {
  document.body.classList.remove('anon');
  S = await API.getState();
  Auth.isAdmin().then(v => { isAdmin = v; });
  if (!started) {
    started = true;
    DB.onSaving(n => { $('#sync').hidden = n === 0; });
    DB.onView(v => { S = v; render(); });
    DB.onError(m => { if (m === 'Войдите заново') sessionLost(); else if (DB.OPTIMISTIC) toast(m, 'bad'); });
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState !== 'visible' || !S || $('#dlg').open || !DB.isIdle()) return;
      try { const fresh = await DB.refresh(); if (fresh && !$('#dlg').open) { S = fresh; render(); } }
      catch (e) { if (cleanErr(e) === 'Войдите заново') sessionLost(); }
    });
  }
  render();
  touchMenu();
  CS = null; CERR = ''; cDraft = null;
  cleanLoad();
  KS = null; KERR = ''; kDraft = null; kWhen = null;
  kidsLoad();
}

(async function init() {
  const cfg = window.APP_CONFIG || {};
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase) {
    $('#view').replaceChildren(h('div', { class: 'empty' }, h('span', { class: 'big', text: '😕' }), 'Приложение не настроено: нет адреса базы. Напишите Санжару.'));
    return;
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try {
    const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    Auth.init(client);
    const logic = Logic.create({
      rng: Math.random,
      id: () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + String(Date.now())).replace(/-/g, '').slice(0, 8),
      now: () => tzDate(true),
      today: () => tzDate(false)
    });
    DB.init(client, logic);
    CST = CleanStore.create({
      logic: CleanLogic.create({ id: () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + String(Date.now())).replace(/-/g, '').slice(0, 8), now: () => tzDate(true), today: () => tzDate(false) }),
      rpc: async (name, args) => { const r = await client.rpc(name, args); if (r.error) throw new Error(r.error.message || String(r.error)); return r.data; }
    });
    KST = CleanStore.create({
      get: 'kids_get', save: 'kids_save', format: 'dk-kids', label: '«Детей»',
      logic: KidsLogic.create({ id: () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + String(Date.now())).replace(/-/g, '').slice(0, 8), now: () => tzDate(true), today: () => tzDate(false) }),
      rpc: async (name, args) => { const r = await client.rpc(name, args); if (r.error) throw new Error(r.error.message || String(r.error)); return r.data; }
    });
    window.API = ApiFactory.create({ db: DB, logic, optimistic: () => DB.OPTIMISTIC, exportXlsx: window.exportXlsxLocal });
    const token = Auth.parseJoinHash(location.hash);
    if (token) return renderAuth('join', { token });
    const session = await Auth.getSession();
    if (!session) return renderAuth('login');
    await startApp();
  } catch (e) {
    $('#view').replaceChildren(h('div', { class: 'empty' }, h('span', { class: 'big', text: '😕' }), 'Не удалось загрузить данные: ' + cleanErr(e)));
  }
})();
</script>
