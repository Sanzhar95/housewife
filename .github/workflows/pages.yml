# Публикация сайта на GitHub Pages. Перед сборкой создаётся public/config.js из переменных репозитория
# SUPABASE_URL и SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → вкладка Variables).
# Ключ service_role сюда класть нельзя: build.js остановит сборку.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main, stage2-supabase]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Создать config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
